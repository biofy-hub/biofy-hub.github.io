<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Comunidad · Biofy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comun/estilo.css">
<script src="../comun/config.js"></script>
<script src="../comun/perfiles.js"></script>
<script src="../comun/nucleo.js"></script>
<script src="../comun/volver.js"></script>
<style>
/* Comunidad (Juan, 26/11/2026): opción C, portada y pestañas. Cada pestaña con su color. */
#app{padding-bottom:90px}
.cm-tabs{position:sticky;top:64px;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.cm-tabs .in{max-width:1000px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.cm-tabs .in::-webkit-scrollbar{display:none}
.cm-tab{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:13px 12px 11px;font-weight:700;font-size:14px;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer;transition:color .2s,border-color .2s}
.cm-tab svg{width:17px;height:17px}
.cm-tab .pt{width:8px;height:8px;border-radius:50%;background:var(--c1)}
.cm-tab.on{color:var(--c1);border-color:var(--c1)}
.cm-tab.oculta{opacity:.5}
.cm-tab .ojo{width:14px;height:14px}
.cm{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.cm-ed{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s}
.sw i:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--brand)}
.sw input:checked+i:after{transform:translateX(16px)}
.b2{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink)}
.b2:hover{background:var(--surface-3)}
.b2 svg{width:16px;height:16px}
.b2.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.b2.pri:hover{filter:brightness(1.07);background:var(--brand)}
.b2.pel{color:var(--bad)}
.hola2{margin:2px 0 14px;animation:entra .5s var(--ease) both}
.hola2 h1{font-size:clamp(22px,4vw,28px);font-weight:800}
.hola2 p{color:var(--ink-3);font-size:14px}
/* ---------- Bloque de color (cabecera de cada pestaña y destacado del Inicio) ---------- */
.banda{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:24px 22px;background:radial-gradient(ellipse at 75% 0%,var(--c1) 0%,var(--c1) 30%,var(--c2) 100%);box-shadow:0 18px 40px color-mix(in srgb,var(--c2) 35%,transparent);animation:entra .55s var(--ease) both;margin-bottom:16px}
.banda>*{position:relative;z-index:2}
.banda .k{font-size:11.5px;letter-spacing:.28em;font-weight:800;color:#ffe08a;text-transform:uppercase}
.banda h2{font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1.05;margin:6px 0 6px;letter-spacing:-.5px}
.banda p.s{font-size:15px;opacity:.92;font-weight:600;max-width:560px}
.decor{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.decor i{position:absolute;top:-20px;color:#fff;opacity:.55;font-style:normal;animation:cae linear infinite}
.decor.confeti i{width:8px;height:12px;border-radius:2px;opacity:.85}
@keyframes cae{to{transform:translateY(420px) rotate(260deg)}}
.brillo{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);z-index:1}
.nums{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.nums span{width:clamp(50px,12vw,66px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,#fbf6ea 35%,#e8dcc0 75%,#c9b48a 100%);color:#3b2a0e;font-weight:900;font-size:clamp(24px,6vw,32px);display:grid;place-items:center;box-shadow:inset -4px -6px 10px rgba(120,90,30,.25),0 8px 18px rgba(0,0,0,.28);animation:cae-bola .9s cubic-bezier(.3,1.4,.5,1) var(--d,0ms) both,balancea 4.5s ease-in-out calc(var(--d,0ms) + 1.2s) infinite}
@keyframes cae-bola{0%{opacity:0;transform:translateY(-60px) rotate(-220deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes balancea{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.cd{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.cd div{background:rgba(255,255,255,.17);border-radius:14px;padding:8px 12px;text-align:center;min-width:64px}
.cd b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.cd small{font-size:11px;opacity:.9;font-weight:700}
.chipb{display:inline-flex;align-items:center;gap:7px;background:#ffd66b;color:#5a3d00;font-weight:800;font-size:13.5px;padding:9px 14px;border-radius:12px;margin-top:14px}
.chipb svg{width:16px;height:16px}
.ir-a{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:#fff;color:var(--c2);font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer}
.ir-a svg{width:16px;height:16px}
/* ---------- Tarjetas del Inicio ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-h b{font-size:17px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(150deg,var(--c1),var(--c2));cursor:pointer;border:0;text-align:left;font:inherit;animation:entra .5s var(--ease) both;transition:transform .2s var(--ease),box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--c2) 35%,transparent)}
.tile .ic{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .ic svg{width:23px;height:23px}
.tile .bd{position:absolute;top:14px;right:14px;background:#fff;color:var(--c2);font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px}
.tile b{font-size:18px;font-weight:800;line-height:1.15}
.tile small{font-size:12.5px;opacity:.92;font-weight:600}
.tile.oculta{opacity:.55}
/* ---------- Contenido ---------- */
.card.pad{padding:16px}
.pieza{display:block;width:100%;border-radius:20px;box-shadow:var(--shadow-up);cursor:zoom-in;animation:entra .5s var(--ease) both}
.texto{font-size:15px;line-height:1.6;color:var(--ink-2)}
.texto p+p{margin-top:8px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.dos{gap:10px}}
.part{padding:12px;text-align:center;position:relative;animation:entra .5s var(--ease) both}
.part b.n{font-size:17px;font-weight:800;display:block;margin-bottom:8px}
.part .foto{aspect-ratio:4/3;border-radius:16px;background:repeating-linear-gradient(45deg,var(--surface-3),var(--surface-3) 9px,var(--surface-2) 9px,var(--surface-2) 18px);display:grid;place-items:center;color:var(--ink-3);font-size:12.5px;font-weight:700;overflow:hidden;margin-bottom:10px}
.part .foto img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.part.mio{outline:3px solid var(--c1);outline-offset:-3px}
.part .corona{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#ffd66b;color:#5a3d00;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.barra{height:9px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin:4px 0 4px}
.barra i{display:block;height:100%;border-radius:9px;background:var(--c1);transition:width .8s var(--ease)}
.mini{font-size:12.5px;color:var(--ink-3);font-weight:700}
.votar{width:100%;margin-top:8px;height:42px;border-radius:12px;border:0;background:var(--c1);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.votar.ya{background:var(--surface-3);color:var(--ink-2)}
.votar:disabled{opacity:.6;cursor:wait}
.aviso{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c1) 10%,var(--surface));color:var(--ink-2);font-weight:600;font-size:14px;margin:12px 0}
.aviso svg{width:18px;height:18px;color:var(--c1)}
.pasos .p{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.pasos .p:last-child{border:0}
.pasos .p i{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--c1) 14%,var(--surface));color:var(--c1);font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.pasos .p span{font-size:14.5px;font-weight:600;padding-top:3px}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dato{padding:14px;display:flex;gap:12px;align-items:center}
.dato .di{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 13%,var(--surface));color:var(--c1);flex:none}
.dato .di svg{width:20px;height:20px}
.dato small{display:block;color:var(--ink-3);font-size:12px;font-weight:600}
.dato b{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.lista .it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink)}
.lista .it:last-child{border:0}
.lista .it .di{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 13%,var(--surface));color:var(--c1);flex:none}
.lista .it .di svg{width:19px;height:19px}
.lista .it b{font-size:14.5px;display:block}
.lista .it small{color:var(--ink-3);font-size:12.5px}
.lista .it .fl{margin-left:auto;color:var(--ink-3)}
.lista .it .fl svg{width:16px;height:16px}
.vacio2{padding:18px;text-align:center;color:var(--ink-3);font-weight:600;font-size:14px}
.carga{display:grid;place-items:center;padding:60px}
.carga i{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--brand);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* Sorteo de personajes (Juan, 27/11) */
.so{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 22px;margin-bottom:16px;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--c1) 22%,var(--surface)) 0%,var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c1) 25%,var(--line));animation:entra .55s var(--ease) both}
.so .k{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--c1)}
.so h3{font-size:22px;font-weight:800;margin:4px 0 12px;letter-spacing:-.3px}
.so-tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-3);margin-bottom:16px}
.so-tabs button{height:36px;padding:0 14px;border-radius:11px;border:0;background:none;font:inherit;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.so-tabs button.on{background:var(--surface);color:var(--c1);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bombo{display:grid;justify-items:center;gap:14px;padding:4px 0 2px}
.bombo svg{width:min(250px,72vw);height:auto;overflow:visible}
.bombo .bolas{transform-origin:110px 96px;animation:gira 7s linear infinite}
.bombo.rapido .bolas{animation-duration:.45s}
.bombo .bola{transform-origin:110px 96px;animation:gira var(--d) linear infinite}
.bombo .bola.rev{animation-direction:reverse}
.bombo .bola g{animation:bote var(--b) ease-in-out infinite alternate}
@keyframes bote{from{transform:translate(0,-3px)}to{transform:translate(0,4px)}}
.bombo.rapido .bola{animation-duration:calc(var(--d) / 6)}
.bombo.rapido .tambor{animation:tiembla .12s linear infinite}
@keyframes tiembla{0%,100%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}75%{transform:translate(-1.5px,1px)}}
.bombo .manivela{transform-origin:182px 96px;animation:gira 7s linear infinite}
.bombo.rapido .manivela{animation-duration:.45s}
.bola-sale{position:absolute;left:50%;top:205px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc93c 45%,#e19a00);box-shadow:0 8px 20px rgba(225,154,0,.45);display:grid;place-items:center;font-weight:900;color:#7a4b00;font-size:20px;opacity:0;pointer-events:none}
.bombo.sale .bola-sale{animation:bola-sale 1.3s var(--ease) forwards}
@keyframes bola-sale{0%{opacity:0;transform:translateY(-40px) scale(.4)}25%{opacity:1;transform:translateY(0) scale(.7)}60%{transform:translateY(-30px) scale(1.35)}80%{transform:translateY(-18px) scale(1.2)}100%{opacity:1;transform:translateY(-24px) scale(1.6)}}
.so .tirar{height:52px;padding:0 26px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 26px color-mix(in srgb,var(--c1) 40%,transparent);display:inline-flex;align-items:center;gap:9px;animation:late 1.8s ease-in-out infinite}
.so .tirar svg{width:20px;height:20px;flex:none}
.so .tirar:disabled{animation:none;opacity:.6;cursor:default}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.so .pista{font-size:13px;color:var(--ink-3);font-weight:600}
.toca-te{position:relative;text-align:center;padding:10px 6px 4px}
.toca-te .emo{font-size:96px;line-height:1;display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 18%,var(--surface)) 0%,transparent 70%)}
.toca-te.nuevo .emo{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.toca-te.nuevo .txt{animation:entra .6s .45s var(--ease) both}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.toca-te small{display:block;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.toca-te b{display:block;font-size:34px;font-weight:900;letter-spacing:-.5px;color:var(--c1);margin:2px 0 4px;line-height:1.1}
.toca-te .quien{font-size:15px;font-weight:700;color:var(--ink-2)}
.toca-te .nota{font-size:13px;color:var(--ink-3);margin-top:10px;font-weight:600}
.estallido{position:absolute;left:50%;top:80px;width:0;height:0;pointer-events:none}
.estallido i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:estalla 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes estalla{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.so-grupo{margin-bottom:14px}
.so-grupo h4{font-size:14px;font-weight:800;margin:4px 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.so-grupo h4 span{font-size:12px;font-weight:700;color:var(--ink-3)}
.so-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.so-fila{display:flex;align-items:center;gap:8px;padding:8px 9px;flex-wrap:wrap;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.so-fila .e{font-size:22px;width:28px;text-align:center;flex:none}
.so-fila .t{min-width:0;flex:1}
.so-fila .t b{display:block;font-size:14px;font-weight:800}
.so-fila .t span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3;overflow-wrap:anywhere}
.so-fila.mio{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,var(--surface))}
.so-fila.oculta{border-style:dashed;background:transparent}
.so-fila.oculta .t b{font-size:13.5px}
.so-fila.oculta .t span{color:var(--ink-3)}
.so-fila.libre .t span{color:var(--ink-3);font-style:italic}
.so-fila .ib{height:30px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--bad);flex:none}
.so-fila .ib.vuelve{color:var(--c1)}
.so-fuera{font-size:13px;color:var(--ink-3);font-weight:600;margin:4px 0 0}
.etq-o{display:inline-flex;align-items:center;gap:5px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:10px}
/* ---------- Ventanas de edición ---------- */
dialog.dl{margin:auto;border:0;border-radius:22px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 30px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-up)}
dialog.dl::backdrop{background:rgba(10,14,25,.5)}
.dl .hd{position:sticky;top:0;background:var(--surface);padding:18px 20px 10px;border-bottom:1px solid var(--line);z-index:2;display:flex;align-items:center;gap:10px}
.dl .hd h3{font-size:18px;font-weight:800;margin-right:auto}
.dl .bd{padding:14px 20px}
.dl .ft{position:sticky;bottom:0;background:var(--surface);padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld input[type=url],.fld textarea,.fld select{width:100%;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:14.5px}
.fld textarea{min-height:86px;resize:vertical}
.fld small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.colores{display:flex;gap:8px;flex-wrap:wrap}
.colores label{cursor:pointer}
.colores input{display:none}
.colores i{display:block;width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,var(--c1),var(--c2));border:3px solid transparent;transition:transform .15s}
.colores input:checked+i{border-color:var(--ink);transform:scale(1.08)}
.img-ed{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-ed .th{width:84px;height:64px;border-radius:10px;background:var(--surface-3);overflow:hidden;display:grid;place-items:center;color:var(--ink-3);font-size:11px;font-weight:700}
.img-ed .th img{width:100%;height:100%;object-fit:cover}
.fila-ed{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fila-ed:last-child{border:0}
.fila-ed input[type=text],.fila-ed input[type=url]{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.ib svg{width:16px;height:16px}
.ib.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ib:disabled{opacity:.35;cursor:default}
.org .pt{width:14px;height:14px;border-radius:5px;background:linear-gradient(150deg,var(--c1),var(--c2));flex:none}
.org .nm{flex:1;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org .nm small{display:block;font-weight:600;color:var(--ink-3);font-size:11.5px}

  const s = (n, c = '') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SV[n] || ''}</svg>`;
  const ICONO_TIPO = { concurso:'casa', loteria:'ticket', evento:'comida', libre:'mega' };

  /* ---------- Contenido de partida (si aún no hay nada guardado) ---------- */
  // Juan, 26/11 (2.1 y 2.2): sin imágenes, tarjeta de texto con lo importante, cuenta atrás de la lotería hasta el 4/12, comida oculta
  const TARJETA = 'Novedades para el personal: el concurso de belenes y la lotería de Navidad.';
  const PARTIDA = () => ({ v: 1, destacada: 'loteria', tarjeta: TARJETA, pestanas: [
    { id: 'belenes', tipo: 'concurso', titulo: 'Belenes', color: 'rojo', decor: 'nieve', oculta: false, k: 'Navidad 2026',
      cab: 'Concurso de belenes', sub: 'Córdoba y Alicante se juegan el mejor belén de la casa', imagen: null,
      participantes: [{ id: 'cordoba', nombre: 'Córdoba', foto: null }, { id: 'alicante', nombre: 'Alicante', foto: null }],
      votacion: 'cerrada', premio: '', puntosTitulo: 'Así funciona',

      puntos: ['Participan | Córdoba y Alicante, con un belén por delegación', 'La foto | se hace a primera hora de la mañana; después, cada uno sigue con su jornada normal', 'Jurado | Javier y José Luis eligen el belén ganador',
        'Tu voto | elige aquí el que más te guste (un voto por persona): así sale el favorito del público',
        'Premio | es para la delegación ganadora, no individual', 'Cuándo se sabe | el ganador y el premio se anuncian en la comida de empresa'] },
    { id: 'loteria', tipo: 'loteria', titulo: 'Lotería', color: 'azul', decor: 'nieve', oculta: false, k: 'Lotería de Navidad 2026',
      cab: '¡Este año jugamos juntos!', numero: '29480', sorteo: '2026-12-22', precio: '20', reservas: 'Inmaculada, de Administración', texto: 'Cada uno con su décimo y todos con el mismo número. ¿Ya tienes el tuyo?', imagen: null,
      cuenta: '2026-12-04', cuentaTexto: 'Quedan para reservar tu décimo', puntosTitulo: 'Lo que tienes que saber',
      intro: 'Cada uno reserva su propio décimo y todos jugamos al mismo número. Resérvalo a tiempo y, el 22 de diciembre, a cruzar los dedos.',
      puntos: ['Nuestro número | 29480', 'Precio | 20 € el décimo', 'Cómo reservarlo | toca el décimo de abajo y escribe por WhatsApp a Inmaculada, de Administración',
        'Fecha límite | viernes 4 de diciembre', 'Sorteo | martes 22 de diciembre'] },
    { id: 'comida', tipo: 'evento', titulo: 'Comida', color: 'verde', decor: 'confeti', oculta: true, k: 'Navidad 2026',
      cab: 'Comida de empresa', sub: 'Vídeos, actividades y todo lo que estamos preparando', fecha: '', hora: '', lugar: '', texto: '', actividades: [], videos: [], imagen: null }
  ] });

  /* ---------- Almacén: carpeta c/ del almacén privado, todo cifrado ---------- */
  const API = `https://api.github.com/repos/${K.o}/${K.r}/contents`, H = { Authorization: 'Bearer ' + K.t, Accept: 'application/vnd.github+json' };
  const u8 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const b64 = b => { let t = ''; const a = new Uint8Array(b); for (let i = 0; i < a.length; i += 8192) t += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(t); };
  const RUTA = 'c/datos.json';
  let D = null, SHA = null;
  async function leeDatos() {
    const r = await fetch(`${API}/${RUTA}?t=${Date.now()}`, { headers: H, cache: 'no-store' });
    if (r.status === 404) { D = PARTIDA(); SHA = null; return; }
    if (!r.ok) throw new Error('No se puede leer Comunidad (' + r.status + ')');
    const j = await r.json(), t = await Hub.cifra.abre(K.k, JSON.parse(new TextDecoder().decode(u8(j.content.replace(/\n/g, '')))));

    D = JSON.parse(t); SHA = j.sha;
  }
  async function guardaDatos(nuevo, msg) {
    const sobre = await Hub.cifra.cierra(K.k, JSON.stringify(nuevo));
    const r = await fetch(`${API}/${RUTA}`, { method: 'PUT', headers: H, body: JSON.stringify({ message: 'Comunidad: ' + msg, content: b64(new TextEncoder().encode(JSON.stringify(sobre))), ...(SHA ? { sha: SHA } : {}) }) });
    if (r.status === 409 || r.status === 422) throw new Error('Otra persona ha cambiado Comunidad mientras tanto. Recarga la página y vuelve a hacerlo.');

  // Imágenes: se reducen (como mucho 1600 px), se pasan a JPEG y se guardan cifradas con un nombre al azar
  const IMG = {};
  function imagen(ruta) {
    if (!ruta) return Promise.resolve(null);
    if (!IMG[ruta]) IMG[ruta] = (async () => {
      const r = await fetch(`${API}/${ruta}`, { headers: { Authorization: H.Authorization, Accept: 'application/vnd.github.raw' }, cache: 'force-cache' });
      if (!r.ok) return null;
      return URL.createObjectURL(new Blob([await Hub.cifra.abreBinario(K.k, await r.arrayBuffer())], { type: 'image/jpeg' }));

  }
  async function subeImagen(archivo) {
    const bm = await createImageBitmap(archivo), esc2 = Math.min(1, 1600 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
    c.width = Math.round(bm.width * esc2); c.height = Math.round(bm.height * esc2);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bm, 0, 0, c.width, c.height);
    const jpg = new Uint8Array(await (await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.86))).arrayBuffer());
    const key = await crypto.subtle.importKey('raw', u8(K.k), 'AES-GCM', false, ['encrypt']), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, jpg)), todo = new Uint8Array(12 + ct.length);
    todo.set(iv); todo.set(ct, 12);
    const ruta = 'c/img/' + [...crypto.getRandomValues(new Uint8Array(10))].map(x => x.toString(16).padStart(2, '0')).join('') + '.bin';
    const r = await fetch(`${API}/${ruta}`, { method: 'PUT', headers: H, body: JSON.stringify({ message: 'Comunidad: imagen nueva', content: b64(todo) }) });
    if (!r.ok) throw new Error('No se ha podido subir la imagen (' + r.status + ')');

  async function leeVotos(pid) {

        + campo('Día del ganador y el premio', `<input type="date" name="revelaFecha" value="${esc(p.revelaFecha || '')}">`, 'Si está vacío sale «Fecha por confirmar» y el hielo no se derrite') + campo('Hora', `<input type="time" name="revelaHora" value="${esc(p.revelaHora || '')}">`)
        + campo('Nota del ganador', txt('revelaNota', p.revelaNota, 'En la comida de empresa'))
        + campo('Título del cubo de hielo', txt('hieloTitulo', p.hieloTitulo, 'El premio está congelado')) + campo('Texto del cubo de hielo', txt('hieloTexto', p.hieloTexto))
        + imgEd('premioImagen', p.premioImagen, 'Imagen del premio dentro del hielo (opcional; sin imagen sale un regalo)')
        + campo('Premio', txt('premio', p.premio, 'Ej.: Una cena para el equipo ganador')) 
        + campo('Título de la tarjeta de texto', txt('puntosTitulo', p.puntosTitulo, 'Lo importante'))
      + campo('Introducción', `<textarea name="intro" rows="3">${esc(p.intro || '')}</textarea>`)
      + campo('Lo importante (una viñeta por línea)', `<textarea name="puntos" rows="6">${esc((p.puntos || []).join('\n'))}</textarea>`, 'Etiqueta | texto. Ej.: «Fecha límite | viernes 4 de diciembre». La etiqueta sale en negrita');
    }
    if (p.tipo === 'evento') cuerpo += campo('Subtítulo', txt('sub', p.sub)) + campo('Día', `<input type="date" name="fecha" value="${esc(p.fecha || '')}">`, 'Si se deja vacío, sale «Fecha por confirmar»')
      + campo('Hora', `<input type="time" name="hora" value="${esc(p.hora || '')}">`) + campo('Lugar', txt('lugar', p.lugar)) + campo('Texto', `<textarea name="texto">${esc(p.texto || '')}</textarea>`)
      + imgEd('imagen', p.imagen, 'Imagen') + campo('Actividades (una por línea)', `<textarea name="actividades">${esc((p.actividades || []).join('\n'))}</textarea>`)
      + `<div class="fld"><span>Vídeos (título y enlace: YouTube, OneDrive…)</span><div id="vids">${(p.videos || []).map(filaVideo).join('')}</div><button class="b2" type="button" data-addv="1" style="margin-top:8px">${s('mas')}Añadir vídeo</button></div>`;
    if (p.tipo === 'libre') cuerpo += campo('Subtítulo', txt('sub', p.sub)) + imgEd('imagen', p.imagen, 'Imagen') + campo('Texto', `<textarea name="texto">${esc(p.texto || '')}</textarea>`);
    cuerpo += `<div class="recuerda" style="margin-top:6px">${s('info')}<div style="flex:1"><b>Recuerda: el texto de la tarjeta de Comunidad en la portada del Hub</b><small style="display:block;color:var(--ink-2);margin:2px 0 6px">Si cambia lo que se anuncia, cámbialo también aquí.</small>${txt('tarjeta', D.tarjeta || TARJETA)}</div></div>`;
    const d = ventana('Editar «' + p.titulo + '»', cuerpo, async d => {
      const n = copia(D), q = n.pestanas.find(x => x.id === p.id);
      if (val(d, 'tarjeta')) n.tarjeta = val(d, 'tarjeta');
      Object.assign(q, { titulo: val(d, 'titulo') || q.titulo, color: (d.querySelector('[name=color]:checked') || {}).value || q.color, decor: val(d, 'decor'), oculta: d.querySelector('[name=oculta]').checked, k: val(d, 'k'), cab: val(d, 'cab') });
      if ('imagen' in q || d.querySelector('[data-img=imagen]')) q.imagen = imgVal(d, 'imagen');
      if (q.tipo === 'loteria') Object.assign(q, { numero: val(d, 'numero').replace(/\D/g, ''), sorteo: val(d, 'sorteo'), precio: val(d, 'precio'), reservas: val(d, 'reservas'), whatsapp: val(d, 'whatsapp'), waTexto: val(d, 'waTexto'), tocaTexto: val(d, 'tocaTexto'), texto: val(d, 'texto'), cuenta: val(d, 'cuenta'), cuentaTexto: val(d, 'cuentaTexto'), puntosTitulo: val(d, 'puntosTitulo'), intro: val(d, 'intro'), puntos: lineas(val(d, 'puntos')) });
      if (q.tipo === 'concurso') {
        q.sub = val(d, 'sub'); q.votacion = val(d, 'votacion'); q.premio = val(d, 'premio');
        Object.assign(q, { fotoFecha: val(d, 'fotoFecha'), fotoHora: val(d, 'fotoHora'), fotoNota: val(d, 'fotoNota'), revelaFecha: val(d, 'revelaFecha'), revelaHora: val(d, 'revelaHora'), revelaNota: val(d, 'revelaNota'),
          hieloTitulo: val(d, 'hieloTitulo'), hieloTexto: val(d, 'hieloTexto'), premioImagen: imgVal(d, 'premioImagen'), hieloDesde: q.hieloDesde || new Date().toISOString().slice(0, 10) }); Object.assign(q, { puntosTitulo: val(d, 'puntosTitulo'), intro: val(d, 'intro'), puntos: lineas(val(d, 'puntos')) });
        q.participantes = [...d.querySelectorAll('#parts .fila-ed')].map(f => ({ id: f.dataset.id, nombre: f.querySelector('input[type=text]').value.trim(), foto: f.querySelector('.img-ed').dataset.v || null })).filter(x => x.nombre);
        if (q.participantes.length < 2) throw new Error('Un concurso necesita al menos dos participantes.');
      }
      if (q.tipo === 'evento') Object.assign(q, { sub: val(d, 'sub'), fecha: val(d, 'fecha'), hora: val(d, 'hora'), lugar: val(d, 'lugar'), texto: val(d, 'texto'), actividades: lineas(val(d, 'actividades')),
        videos: [...d.querySelectorAll('#vids .fila-ed')].map(f => ({ titulo: f.querySelector('[name=vt]').value.trim(), url: f.querySelector('[name=vu]').value.trim() })).filter(v => /^https?:\/\//i.test(v.url)) });
      if (q.tipo === 'libre') Object.assign(q, { sub: val(d, 'sub'), texto: val(d, 'texto') });
      await guardaDatos(n, 'cambios en «' + q.titulo + '»');
      toast('Guardado'); desdeHash();
    });
    activaImagenes(d);
    d.addEventListener('click', e => {
      if (e.target.closest('[data-addp]')) { const box = d.querySelector('#parts'); box.insertAdjacentHTML('beforeend', filaPart({ id: 'p' + Date.now().toString(36), nombre: '', foto: null })); activaImagenes(box.lastElementChild); }
      if (e.target.closest('[data-addv]')) d.querySelector('#vids').insertAdjacentHTML('beforeend', filaVideo({ titulo: '', url: '' }));
      const del = e.target.closest('[data-delf]'); if (del) del.closest('.fila-ed').remove();
    });
  }
  const filaPart = x => `<div class="fila-ed" data-id="${esc(x.id)}"><input type="text" value="${esc(x.nombre)}" placeholder="Nombre (p. ej. Córdoba)">
    <div class="img-ed" data-img="f_${esc(x.id)}" data-v="${esc(x.foto || '')}"><div class="th" style="width:56px;height:44px">${x.foto ? `<img data-src="${esc(x.foto)}" alt="">` : 'Foto'}</div><label class="ib" title="Subir foto">${s('foto')}<input type="file" accept="image/*" hidden></label></div>
    <button class="ib" type="button" data-delf="1" title="Quitar">${s('papelera')}</button></div>`;
  const filaVideo = v => `<div class="fila-ed"><input type="text" name="vt" value="${esc(v.titulo)}" placeholder="Título"><input type="url" name="vu" value="${esc(v.url)}" placeholder="https://…"><button class="ib" type="button" data-delf="1" title="Quitar">${s('papelera')}</button></div>`;

  async function cambiaVisible(p) {
    if (!p) return;
    const n = copia(D), q = n.pestanas.find(x => x.id === p.id); q.oculta = !q.oculta;
    try { await guardaDatos(n, (q.oculta ? 'ocultar' : 'mostrar') + ' «' + q.titulo + '»'); toast(q.oculta ? 'Pestaña oculta: solo la ven quienes editan' : 'Pestaña visible para todos'); desdeHash(); } catch (e) { toast(e.message, true); }
  }
  function cambiaTarjeta() {
    ventana('Texto de la tarjeta en el Hub', campo('Texto que sale en la tarjeta de Comunidad, en la portada del Hub', `<textarea name="tarjeta" rows="3">${esc(D.tarjeta || TARJETA)}</textarea>`, 'Corto: una o dos líneas'), async d => {
      const t = val(d, 'tarjeta'); if (!t) throw new Error('Escribe el texto de la tarjeta.');
      const n = copia(D); n.tarjeta = t; await guardaDatos(n, 'texto de la tarjeta del Hub'); toast('Guardado'); desdeHash();
    });
  }
  function organizar() {
    let L = copia(D.pestanas), dest = D.destacada;
    const fila = (p, i) => `<div class="fila-ed org" style="${cv(p.color)}" data-i="${i}"><span class="pt"></span><span class="nm">${esc(p.titulo)}<small>${p.oculta ? 'Oculta' : 'Visible'}${dest === p.id ? ' · Destacada en el Inicio' : ''}</small></span>
      <button class="ib ${dest === p.id ? 'on' : ''}" type="button" data-o="dest" title="Destacar en el Inicio">${s('estrella')}</button>
      <button class="ib" type="button" data-o="ver" title="${p.oculta ? 'Mostrar' : 'Ocultar'}">${s(p.oculta ? 'ojoNo' : 'ojo')}</button>
      <button class="ib" type="button" data-o="sube" ${i === 0 ? 'disabled' : ''} title="Subir">${s('arriba')}</button>
      <button class="ib" type="button" data-o="baja" ${i === L.length - 1 ? 'disabled' : ''} title="Bajar">${s('abajo')}</button>
      ${p.tipo === 'libre' ? `<button class="ib" type="button" data-o="borra" title="Borrar">${s('papelera')}</button>` : ''}</div>`;
    const d = ventana('Organizar pestañas', `<p class="mini" style="margin-bottom:8px">Ordena las pestañas, ocúltalas o elige cuál sale en grande en el Inicio.</p><div id="org"></div>`, async () => {
      const n = copia(D); n.pestanas = L; n.destacada = dest;
      await guardaDatos(n, 'orden y visibilidad de las pestañas'); toast('Guardado'); desdeHash();
    });
    const pinta2 = () => { d.querySelector('#org').innerHTML = L.map(fila).join(''); };
    pinta2();
    d.querySelector('#org').onclick = e => {
      const b = e.target.closest('[data-o]'); if (!b) return;
      const i = +b.closest('[data-i]').dataset.i, o = b.dataset.o;
      if (o === 'dest') dest = L[i].id;
      if (o === 'ver') L[i].oculta = !L[i].oculta;
      if (o === 'sube' && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
      if (o === 'baja' && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
      if (o === 'borra' && confirm('¿Borrar la pestaña «' + L[i].titulo + '»?')) L.splice(i, 1);
      pinta2();
    };
  }
  function nuevaPestana() {
    ventana('Nueva pestaña', campo('Nombre de la pestaña', txt('titulo', '', 'Ej.: Avisos')) + campo('Color', colores('morado')), async d => {
      const t = val(d, 'titulo'); if (!t) throw new Error('Pon un nombre a la pestaña.');
      const n = copia(D), id = (Hub.slugNombre(t) || 'pestana') + '-' + Date.now().toString(36).slice(-4);
      n.pestanas.push({ id, tipo: 'libre', titulo: t, color: (d.querySelector('[name=color]:checked') || {}).value || 'morado', decor: 'ninguna', oculta: true, k: '', cab: t, sub: '', texto: '', imagen: null });
      await guardaDatos(n, 'pestaña nueva «' + t + '»'); toast('Creada (oculta hasta que la muestres)'); ir(id);
    }, 'Crear');
  }

  /* ---------- Arranque ---------- */
  app.innerHTML = '<div class="carga"><i></i></div>';
  try { await leeDatos(); } catch (e) { app.innerHTML = `<main class="cm"><div class="card vacio"><h1>Comunidad</h1><p>${esc(e.message)}</p></div></main>`; return; }
  desdeHash();
})();
</script>
</body>
</html>
