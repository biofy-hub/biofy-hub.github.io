<style>
#app{padding-bottom:40px}
.q-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 14px;animation:entra .5s var(--ease) both}
.q-cab h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.4px}
.q-cab p{color:var(--ink-3);margin-top:2px}
.pestanas{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow);flex-wrap:wrap}
.pestanas button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s}
.pestanas button svg{width:17px;height:17px}
.pestanas button.on{background:var(--brand);color:#fff}
.pestanas button:not(.on):hover{background:var(--surface-3)}
.bloque{padding:16px 18px;margin-bottom:14px;animation:entra .45s var(--ease) both}
.bloque h2 svg{width:16px;height:16px;color:var(--brand)}
.bloque h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.fila>*,.art>*,.c{min-width:0}
@media (max-width:600px){.fila.dr{grid-template-columns:1fr}}
.c .campo{width:100%;min-width:0}
.c{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.campo{height:44px;font-size:15px}
.campo.mayus{text-transform:uppercase}
select.campo{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.dia{display:flex;align-items:center;gap:8px}
.dia .campo{flex:1;min-width:0}
.btn.chico{width:auto;height:44px;margin:0;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.btn.chico svg{width:17px;height:17px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{background:var(--surface-3);filter:none}
.btn.ic{width:44px;padding:0}
.btn.peligro{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface);transition:all .15s}
.seg input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.seg.res input[value="conf"]:checked+span{background:var(--brand);border-color:var(--brand)}
.seg.res input[value="nulo"]:checked+span{background:var(--ink-3);border-color:var(--ink-3)}
.seg.res input[value="demo"]:checked+span{background:var(--warn);border-color:var(--warn)}
.seg.res input[value="venta"]:checked+span{background:var(--good);border-color:var(--good)}
/* «¿Es tu coche?» (Juan, 26/11): obligatoria, con un cochecito que va andando */
.coche-q{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.coche-q .preg{font-size:16px;font-weight:700;color:var(--ink)}
.coche-q .preg small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.coche-q.falta .preg{color:var(--bad)}
.coche-anim{position:relative;width:120px;height:58px;overflow:hidden;flex:none}
.coche-anim svg{position:absolute;left:12px;bottom:9px;width:92px;animation:coche-bote .45s ease-in-out infinite alternate}
.coche-anim .rueda{transform-box:fill-box;transform-origin:center;animation:coche-rueda .5s linear infinite}

.seg.coche input[value="si"]:checked+span{background:var(--good);border-color:var(--good)}

/* Barra inferior (guardar / firmar) */
.barra-q{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center}

.tq .cab{display:flex;align-items:center;gap:10px}

.fila-c:last-child{border-bottom:0}
.fila-c:hover:not(:disabled){background:var(--surface-3)}

.fila-c>svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.fila-c .t{flex:1;min-width:0}
.fila-c b{display:block;font-size:15px}
.fila-c small{color:var(--ink-3);font-size:12.5px}

.avq{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avq img{width:100%;height:100%;object-fit:cover}
.luz{width:12px;height:12px;border-radius:50%;flex:none}
.luz.si{background:#22a559;box-shadow:0 0 0 4px rgba(34,165,89,.18),0 0 10px rgba(34,165,89,.55)}
.luz.medio{background:#e8a21d;box-shadow:0 0 0 4px rgba(232,162,29,.18)}
.luz.antes{background:var(--line-2)}
.est.antes{background:var(--surface-3);color:var(--ink-3)}
.luz.no{background:#d93f3f;box-shadow:0 0 0 4px rgba(217,63,63,.15);animation:late 2s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 0 7px rgba(217,63,63,.05)}}
.est{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.est.si{background:var(--good-soft);color:var(--good)}
.est.medio{background:var(--warn-soft);color:var(--warn)}

@media (max-width:600px){.fila-c>svg{display:none}.fila-c{flex-wrap:wrap}.fila-c .mini-res{width:100%;justify-content:flex-start;padding-left:24px}}
/* Tabla de detalle y hoja de producción */
.tabla-c{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

table.t tr.dia td{background:var(--brand-soft);color:var(--brand-ink);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.6px}
table.t th.g{text-align:center;border-left:1px solid var(--line)}
table.t td.bl{border-left:1px solid var(--line)}
.cero{color:var(--ink-3)}
.num-h{width:44px;height:32px;border:1px solid var(--line-2);border-radius:8px;text-align:center;font:inherit;font-weight:700;background:var(--surface);color:var(--ink)}
.num-h:focus{outline:2px solid var(--brand);outline-offset:1px}
table.hoja-t td.n{padding:4px 6px}
table.t tr.dia{display:table-row}
table.t tr.dia td.dl{text-align:center;font-size:10px;letter-spacing:.2px;padding:4px 3px;white-space:nowrap}
/* Hojas a mano (Juan, 26/11): cada origen con su color para distinguir Registros móviles y MKT */
table.t th.og-reg{background:color-mix(in srgb,#2968fe 15%,var(--surface));color:var(--brand-ink)}

:root[data-theme="dark"] table.t th.og-mkt{color:#c4b5fd}
table.t tr.dia td.dl.og-reg{background:color-mix(in srgb,#2968fe 15%,var(--surface))}
table.t tr.dia td.dl.og-mkt{background:color-mix(in srgb,#8b5cf6 17%,var(--surface));color:#7c3aed}
:root[data-theme="dark"] table.t tr.dia td.dl.og-mkt{color:#c4b5fd}
.atajos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filtro-f{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:all .15s}
.filtro-f:hover{border-color:var(--brand);color:var(--brand)}
.filtro-f.on{background:var(--brand);border-color:var(--brand);color:#fff}
.avq.fecha-q{background:var(--surface-3);color:var(--ink-2);font-size:14px}

.pestanas .s{display:none}
@media (max-width:600px){.pestanas{display:flex;width:100%}.pestanas button{flex:1;justify-content:center;padding:8px 6px;font-size:13px}.pestanas .l{display:none}.pestanas .s{display:inline}.barra-q .estado-g{display:none}.barra-q .der{width:100%;min-width:0}.barra-q .der .btn{flex:1 1 0;min-width:0;padding:0 8px;font-size:13.5px;white-space:nowrap}}

<body>
<main class="wrap" id="app"><p class="cargando">Abriendo las quinielas…</p></main>
<dialog id="dlg"></dialog>
<script>
/* Módulo QUINIELAS (Juan, 23/11/2026): la quiniela diaria de cada comercial, firmada con el dedo,
   y la hoja de producción, que sale sola sumando las quinielas.
   Cada quiniela va CIFRADA en el repositorio privado: con la clave pública de los jefes (solo «Ver todas»
   tiene la privada) y con la llave propia del comercial (para que pueda releer la suya). Quien solo rellena
   no puede leer las de los demás. En GitHub solo se ve un nombre de archivo sin datos. */
Hub.listo.then(async function () {
  if (!Hub.sesion() || !Hub.puede('quinielas')) { location.replace('../index.html'); return; }
  Hub.cabecera('Quinielas', 'quiniela');
  const app = document.getElementById('app'), dlg = document.getElementById('dlg'), { esc } = Hub;
  const K = Hub.llave('quinielas');
  const sinLlave = t => { app.innerHTML = `<div class="card vacio"><div class="ic">${Hub.icono('quiniela')}</div><h1>Quinielas</h1><p>${t}</p></div>`; };
  if (!K || !K.t) return sinLlave('El módulo está en construcción: todavía no está conectado a su almacén de datos. Avisa a Claude.');
  // Perfiles (24/11): Usuario (su quiniela) · Coord. teleoperadoras/mailing (solo su hoja) · Jefe (su equipo) · Ver todas (administración y dirección) · Admin (todo)
  const PERM = Hub.permiso('quinielas'), ADMIN = PERM === 'todas', JEFE = PERM === 'jefe', VER = PERM === 'ver', COORD = K.soloHoja || null;
  const TODAS = !!(K.priv || K.privEq);   // ve quinielas de otros (admin, ver todas o jefe)
  const GLOBAL = !!K.priv;                // ve las de todos los equipos
  let PARA = null;   // admins: la persona a la que se le rellena la quiniela (null = la propia)
  const propiaActual = () => PARA ? (PARA.qk || null) : K.propia;

  /* ---------- Listas (Juan, 23/11) ---------- */
  // Orígenes según el tipo de persona en ACCESOS (Juan, 24/11): los VIP tienen los suyos.
  const ORIGENES_COM = ['Registros móviles', 'MKT', 'Autocaptado', 'Guía'];
  const ORIGENES_VIP = ['VIP', 'VIP Biofy', 'MKT', 'Registros móviles'];

      <div class="c">Tipo de trabajo${radios('trabajo', TRABAJOS.map(o => [o, o]), v.trabajo)}</div>
      <div class="c">Resultado${radios('resultado', Object.entries(RES_INST), v.resultado, 'res')}</div>
      <div class="c">Además<div class="seg"><label><input type="checkbox" name="demo" ${v.demo ? 'checked' : ''}><span>Ha hecho demo</span></label><label><input type="checkbox" name="ventaMant" ${v.ventaMant ? 'checked' : ''}><span>Ha vendido mantenimiento</span></label></div></div>
      <div class="c">Dispositivos (lo que instala o entrega)</div><div class="solo-inst" style="margin-top:0">${articulos.replace(/>Artículo (\d)</g, '>Dispositivo $1<')}</div>
      <details class="extra-inst" ${v.importe || v.cobro ? 'open' : ''}><summary>Cobro (si lo hay)</summary><div class="solo-inst">${cobro}</div></details>`
      : `
      <div class="c">Origen del cliente${radios('origen', origenesDe().concat(v.origen && !origenesDe().includes(v.origen) ? [v.origen] : []).map(o => [o, o]), v.origen)}</div>
      <div class="c">Tipo de oferta${radios('oferta', OFERTAS.map(o => [o, o]), v.oferta)}</div>
      <div class="c">Resultado${conConf(Q) ? ' <small class="muted" style="font-weight:500">(Confirmado y Demo se pueden marcar juntos)</small>' : ''}${casillas('resultado', Object.entries(RES).filter(([k]) => k !== 'conf' || conConf(Q) || tiene(v, 'conf')), resultadosDe(v), 'res')}</div>
      <div class="solo-venta">
        <div class="c">Estado de la venta${radios('estado', [['conf', 'Cerrada'], ['pte', 'Pendiente']], v.estado || 'conf')}</div>
        ${articulos}${cobro}
      </div>`}
      <p class="error-q" id="errv"></p>
      <div class="acciones">${i !== null ? `<button class="btn chico peligro" type="button" id="quitar">${ic('borrar')}Quitar</button>` : ''}
        <div class="der"><button class="btn chico sec" type="button" id="cancelar">Cancelar</button><button class="btn chico" type="submit">${i === null ? 'Añadir' : 'Guardar visita'}</button></div></div></form>`;
    dlg.showModal();
    const f = dlg.querySelector('#fv');
    f.querySelectorAll('.mayus').forEach(x => formatoVivo(x, limpia));
    ['importe', 'cuota1'].forEach(n => formatoVivo(f.elements[n], conPuntos));
    formatoVivo(f.elements.cuotas, x => String(x).replace(/\D/g, ''));
    // «Otro…»: aparece el recuadro para escribir el producto
    [0, 1, 2, 3].forEach(k => { const sel = f.elements['art' + k], tx = f.elements['otro' + k]; sel.onchange = () => { tx.hidden = sel.value !== OTRO; if (!tx.hidden) tx.focus(); }; });
    if (!inst) f.querySelectorAll('input[name="resultado"]').forEach(x => x.onchange = () => {
      // Solo se pueden juntar Confirmado y Demo (Juan, 26/11); Nulo y Venta van siempre solos
      if (x.checked) f.querySelectorAll('input[name="resultado"]:checked').forEach(o => { if (o !== x && !(DOBLE.includes(o.value) && DOBLE.includes(x.value))) o.checked = false; });
      f.classList.toggle('es-venta', !!f.querySelector('input[name="resultado"][value="venta"]:checked'));
    });
    dlg.querySelector('#cancelar').onclick = () => dlg.close();
    const q = dlg.querySelector('#quitar'); if (q) q.onclick = () => { if (!confirm('¿Quitar esta visita?')) return; Q.visitas.splice(i, 1); dlg.close(); toca(); pintaMia(); };
    f.onsubmit = e => {
      e.preventDefault();
      const d = new FormData(f), g = k => (d.get(k) || '').toString().trim();
      const arts = () => [0, 1, 2, 3].map(k => ({ nombre: g('art' + k) === OTRO ? limpia(g('otro' + k)).trim() : g('art' + k), entrega: d.get('ent' + k) === 'on' })).filter(a => a.nombre);
      const otroVacio = [0, 1, 2, 3].some(k => g('art' + k) === OTRO && !limpia(g('otro' + k)).trim());
      const nv = { cliente: limpia(g('cliente')).trim(), poblacion: limpia(g('poblacion')).trim(), resultado: g('resultado') };
      let falta;
      if (inst) {
        Object.assign(nv, { trabajo: g('trabajo'), demo: d.get('demo') === 'on', ventaMant: d.get('ventaMant') === 'on', articulos: arts(), importe: conPuntos(g('importe')), cuota1: conPuntos(g('cuota1')), cuotas: g('cuotas'), cobro: g('cobro') });
        falta = [!nv.cliente && 'el cliente', !nv.trabajo && 'el tipo de trabajo', !nv.resultado && 'el resultado'].filter(Boolean);
      } else {
        const rs = d.getAll('resultado').map(String).sort((a, b) => ORDEN_RES.indexOf(a) - ORDEN_RES.indexOf(b)).slice(-2);
        nv.resultado = rs[rs.length - 1] || ''; if (rs.length === 2) nv.resultado2 = rs[0];   // el principal es el más avanzado
        Object.assign(nv, { origen: g('origen'), oferta: g('oferta') });
        falta = [!nv.cliente && 'el cliente', !nv.origen && 'el origen', !nv.resultado && 'el resultado'].filter(Boolean);
        if (nv.resultado === 'venta') {
          Object.assign(nv, { estado: g('estado') || 'conf', articulos: arts(), importe: conPuntos(g('importe')), cuota1: conPuntos(g('cuota1')), cuotas: g('cuotas'), cobro: g('cobro') });
          if (!nv.articulos.length) falta.push('al menos un artículo');
          if (!nv.importe) falta.push('el importe');
        }
      }
      if (otroVacio) falta.push('escribir el producto de «Otro»');
      if (falta.length) { dlg.querySelector('#errv').textContent = 'Falta ' + falta.join(', ') + '.'; return; }
      if (i === null) Q.visitas.push(nv); else Q.visitas[i] = nv;
      dlg.close(); toca(); pintaMia();
    };
  }

  /* ---------- Firma con el dedo ---------- */
  function pideFirma() {
    if (bloqueada(Q)) return toca();
    if (!Q.delegacion) { aviso('Elige tu delegación antes de firmar.', true); return; }
    if (conConf(Q) && !Q.coche) { aviso('Marca si es tu coche (Sí o No) antes de firmar.', true); const cc = app.querySelector('#cocheCard'); if (cc) cc.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (!Q.visitas.length && !confirm('No hay visitas. ¿Firmar la quiniela vacía?')) return;
    dlg.innerHTML = `<div class="dc"><h2>Firma tu quiniela</h2><p class="muted" style="font-size:14px">${esc(fechaLarga(fecha))} · ${Q.visitas.length} visita${Q.visitas.length === 1 ? '' : 's'}. Firma con el dedo (o el ratón) dentro del recuadro.</p>
      <canvas class="lienzo" id="lienzo"></canvas>
      <div class="acciones"><button class="btn chico sec" type="button" id="limpiar">${ic('borrar')}Borrar</button>
        <div class="der"><button class="btn chico sec" type="button" id="cancelar">Cancelar</button><button class="btn chico" type="button" id="ok" disabled>${ic('ok')}Firmar y enviar</button></div></div></div>`;
    dlg.showModal();
    const cv = dlg.querySelector('#lienzo'), ctx = cv.getContext('2d'), ok = dlg.querySelector('#ok');
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1d23';
    let dibuja = false, trazos = 0, ult = null;
    const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { dibuja = true; ult = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(ult[0], ult[1], 1.2, 0, 7); ctx.fillStyle = '#1b1d23'; ctx.fill(); };
    cv.onpointermove = e => { if (!dibuja) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(ult[0], ult[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ult = p; trazos++; if (trazos > 8) ok.disabled = false; };
    cv.onpointerup = cv.onpointercancel = () => { dibuja = false; };
    dlg.querySelector('#limpiar').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); trazos = 0; ok.disabled = true; };
    dlg.querySelector('#cancelar').onclick = () => dlg.close();
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = 'Enviando…';
      // la firma, recortada a lo dibujado y en PNG
      Q.firma = cv.toDataURL('image/png'); Q.firmada = new Date().toISOString(); Q.firmadaPor = PARA ? (K.nombreCompleto || Hub.sesion().nombre) : null; Q.corregida = null; Q.corregidaPor = null; cambios = true;
      if (await guarda(true)) dlg.close(); else { ok.disabled = false; ok.innerHTML = ic('ok') + 'Firmar y enviar'; Q.firma = null; Q.firmada = null; }
    };
  }

  /* =================== QUINIELAS DEL DÍA (ver todas) =================== */
  let RUTAS = null, SHAS = {}, CACHE = {};
  async function rutas(forzar) { if (!RUTAS || forzar) RUTAS = await lista(); return RUTAS; }
  // Se guarda en memoria por versión del archivo: si no ha cambiado, no se vuelve a pedir (menos esperas al ver un mes entero).
  async function quinielaDe(ruta) { const k = ruta + '@' + (SHAS[ruta] || ''); if (!CACHE[k]) CACHE[k] = lee(ruta).then(r => r.dato).catch(() => { delete CACHE[k]; return null; }); return CACHE[k]; }
  async function variasDe(rs) {   // de 8 en 8, para no saturar
    const out = {}; let i = 0;
    await Promise.all(Array.from({ length: Math.min(8, rs.length) }, async () => { while (i < rs.length) { const r = rs[i++]; out[r] = await quinielaDe(r); } }));
    return out;
  }

  /* Filtros (Juan, 24/11): por fechas (un día, una semana, un mes…) y por comercial. */
  const finDeMes = iso => { const d = new Date(iso.slice(0, 7) + '-01T12:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); return d.toISOString().slice(0, 10); };
  const mesEntero = (a, b) => a.endsWith('-01') && b === finDeMes(a);
  const laborable = iso => ![0, 6].includes(new Date(iso + 'T12:00:00').getDay());
  const diasEntre = (a, b) => { const t = []; for (let d = a; d <= b && t.length < 400; d = sumaDias(d, 1)) t.push(d); return t; };
  const ATAJOS = {
    hoy: () => [hoyISO(), hoyISO()],
    ayer: () => { let d = sumaDias(hoyISO(), -1); while (!laborable(d)) d = sumaDias(d, -1); return [d, d]; },
    semana: () => [lunesDe(hoyISO()), sumaDias(lunesDe(hoyISO()), 6)],
    mes: () => [hoyISO().slice(0, 8) + '01', finDeMes(hoyISO())],
    mesPasado: () => { const d = new Date(hoyISO().slice(0, 8) + '01T12:00:00'); d.setDate(0); const f = d.toISOString().slice(0, 10); return [f.slice(0, 8) + '01', f]; }
  };
  let desde = hoyISO(), hasta = hoyISO(), comFiltro = '', tipoFiltro = '';
  function mueve(n) {   // flechas: un día, una semana o un mes, según lo que se esté viendo
    if (mesEntero(desde, hasta)) { const d = new Date(desde + 'T12:00:00'); d.setMonth(d.getMonth() + n); desde = d.toISOString().slice(0, 10); hasta = finDeMes(desde); }
    else { const l = diasEntre(desde, hasta).length; desde = sumaDias(desde, n * l); hasta = sumaDias(hasta, n * l); }
    vistaDia();
  }
  const fechaCortaL = iso => new Date(iso + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
  const tituloPeriodo = () => desde === hasta ? fechaLarga(desde) : mesEntero(desde, hasta)
    ? (t => t.charAt(0).toUpperCase() + t.slice(1))(new Date(desde + 'T12:00:00').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }))
    : `Del ${fechaCortaL(desde)} al ${fechaCortaL(hasta)}`;

  async function vistaDia() {
    if (hasta < desde) [desde, hasta] = [hasta, desde];
    // Quien ve todos los equipos ve también a los jefes de equipo (Juan, 24/11)
    const lista = (K.equipo || []).concat(GLOBAL ? (K.jefes || []).filter(j => !(K.equipo || []).some(m => m.uid === j.uid)) : [])
      .concat(JEFE && K.uid ? [{ uid: K.uid, nombre: K.nombreCompleto, tipo: K.tipo || '', rol: '', equipo: K.equipoJefe }] : []);   // el jefe se ve también a sí mismo
    const equipo = await Promise.all(lista.map(async m => ({ ...m, carpeta: await carpeta(m.uid) })));
    const atajo = Object.keys(ATAJOS).find(k => { const [a, b] = ATAJOS[k](); return a === desde && b === hasta; }) || '';
    const chip = (k, t) => `<button type="button" class="filtro-f ${atajo === k ? 'on' : ''}" data-a="${k}">${t}</button>`;
    marco(`<div class="card bloque no-imprimir">
        <div class="atajos">${chip('hoy', 'Hoy')}${chip('ayer', 'Día anterior')}${chip('semana', 'Esta semana')}${chip('mes', 'Este mes')}${chip('mesPasado', 'Mes pasado')}</div>
        <div class="fila dr">
        <label class="c">Desde<div class="dia"><button class="btn chico sec ic" type="button" id="ant" aria-label="Anterior">${ic('izq')}</button><input class="campo" type="date" id="desde" value="${desde}"></div></label>
        <label class="c">Hasta<div class="dia"><input class="campo" type="date" id="hasta" value="${hasta}"><button class="btn chico sec ic" type="button" id="sig" aria-label="Siguiente">${ic('der')}</button></div></label>
        <label class="c">Delegación<select class="campo" id="deleg">${['Todas'].concat(DELEGACIONES).map(d => `<option ${d === delegFiltro ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
        ${GLOBAL ? `<label class="c">Tipo<select class="campo" id="tipoF"><option value="">Todos</option>${[...new Set(equipo.map(m => m.tipo).filter(Boolean))].sort().map(t => `<option ${t === tipoFiltro ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>` : ''}
        <label class="c">Persona<select class="campo" id="com"><option value="">Todas</option>${[...new Set(equipo.filter(m => !tipoFiltro || m.tipo === tipoFiltro).map(m => m.nombre).concat(comFiltro ? [comFiltro] : []))].sort((a, b) => a.localeCompare(b)).map(n => `<option ${n === comFiltro ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label></div></div>
      <div id="cuerpo"><p class="cargando">Abriendo las quinielas…</p></div>`);
    app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { [desde, hasta] = ATAJOS[b.dataset.a](); vistaDia(); });
    app.querySelector('#desde').onchange = e => { if (!e.target.value) return; desde = e.target.value; if (hasta < desde) hasta = desde; vistaDia(); };
    app.querySelector('#hasta').onchange = e => { if (!e.target.value) return; hasta = e.target.value; if (hasta < desde) desde = hasta; vistaDia(); };
    app.querySelector('#ant').onclick = () => mueve(-1);
    app.querySelector('#sig').onclick = () => mueve(1);
    app.querySelector('#deleg').onchange = e => { delegFiltro = e.target.value; vistaDia(); };
    app.querySelector('#com').onchange = e => { comFiltro = e.target.value; vistaDia(); };
    const tf = app.querySelector('#tipoF'); if (tf) tf.onchange = e => { tipoFiltro = e.target.value; comFiltro = ''; vistaDia(); };

    const todas = await rutas(true);
    const primera = {}; for (const p of todas) { const [, cp, f] = p.split('/'), d = f.slice(0, 10); if (!primera[cp] || d < primera[cp]) primera[cp] = d; }
    // Personas: las de la lista (quien tiene que rellenarla) y cualquier otra que haya enviado en esas fechas
    const enRango = todas.filter(p => { const d = p.slice(-15, -5); return d >= desde && d <= hasta; });
    const personas = equipo.map(m => ({ nombre: m.nombre, tipo: m.tipo || '', rol: [m.tipo, m.rol].filter(Boolean).join(' · '), carpeta: m.carpeta }));
    // quien envía sin estar en la lista: solo lo ven quienes ven todos los equipos (un jefe no puede abrir las de otros equipos)
    if (GLOBAL) for (const p of enRango) { const cp = p.split('/')[1]; if (!personas.some(x => x.carpeta === cp)) personas.push({ nombre: null, tipo: '', rol: '', carpeta: cp }); }
    const elegidas = personas.filter(x => (!comFiltro || x.nombre === comFiltro) && (!tipoFiltro || x.tipo === tipoFiltro || (!x.tipo && !x.nombre)));
    const qsDe = await variasDe(enRango.filter(p => elegidas.some(x => x.carpeta === p.split('/')[1])));
    for (const x of personas) if (!x.nombre) { const r = Object.keys(qsDe).find(p => p.split('/')[1] === x.carpeta && qsDe[p]); x.nombre = r ? qsDe[r].comercial : '¿?'; }
    const dias = diasEntre(desde, hasta);
    // Un registro por persona y día: con quiniela, o día laborable (hasta hoy) en que ya la usaba y no la envió
    const registros = [];
    for (const x of elegidas) for (const d of dias) {
      const ruta = `q/${x.carpeta}/${d}.json`, q = qsDe[ruta] || null;
      const antes = !primera[x.carpeta] || d < primera[x.carpeta];
      if (q || desde === hasta || (laborable(d) && d <= hoyISO() && !antes)) registros.push({ x, d, q, antes });
    }
    const delegDe = x => { const q = registros.find(r => r.x === x && r.q); return (q && q.q.delegacion) || DELEGACIONES.find(d => (x.rol || '').toLowerCase().includes(d.toLowerCase())) || ''; };
    const vale = r => delegFiltro === 'Todas' || !delegDe(r.x) || delegDe(r.x) === delegFiltro;
    const vis = registros.filter(vale);
    const estado = r => r.q ? (r.q.firmada ? 'si' : 'medio') : r.antes ? 'antes' : 'no';
    const TXT = { si: 'Enviada y firmada', medio: 'Guardada, sin firmar', no: 'Sin enviar', antes: 'Aún no usaba la digital' };
    const suma = rs => rs.filter(r => r.q).reduce((t, r) => { const s = resumen(r.q); for (const k in s) t[k] = (t[k] || 0) + s[k]; return t; }, {});
    const cuenta = (rs, e) => rs.filter(r => estado(r) === e).length;
    const tot = suma(vis), c = app.querySelector('#cuerpo');
    const cabecera = `<div class="card bloque"><h2>${ic('hoja')}${esc(tituloPeriodo())}${tipoFiltro ? ' · ' + esc(tipoFiltro) : ''}${comFiltro ? ' · ' + esc(comFiltro) : ''}</h2><div class="resumen">
        <div class="ven"><small>Firmadas</small><b>${cuenta(vis, 'si')}</b></div><div class="dem"><small>Sin firmar</small><b>${cuenta(vis, 'medio')}</b></div><div><small>Sin enviar</small><b style="color:var(--bad)">${cuenta(vis, 'no')}</b></div>
        <div class="cnf"><small>Confirmados</small><b>${tot.confirmados || 0}</b></div><div><small>Nulos</small><b>${tot.nulos || 0}</b></div><div><small>Demos</small><b>${tot.demos || 0}</b></div><div><small>Ventas</small><b>${tot.ventas || 0}</b></div><div><small>Importe</small><b style="font-size:17px">${euros(tot.importe)}</b></div></div></div>`;
    const avatar = n => `<span class="avq" data-n="${esc(n)}">${esc((n || '?').trim()[0])}</span>`;
    // Confirmados (25/11): siempre a los comerciales de Córdoba y Alicante; a los demás, solo si tienen alguno
    const mini = (s, conf) => s ? `${conf || s.confirmados ? `<span class="c">${s.confirmados || 0} confirmados</span>` : ''}<span>${s.nulos || 0} nulos</span><span class="d">${s.demos || 0} demos</span><span class="v">${s.ventas || 0} ventas</span>` : '';
    let filas = [], html = '';
    if (desde === hasta || comFiltro) {
      // Un día (todas las personas) o una persona (todos sus días): una fila por quiniela
      filas = vis.slice().sort((a, b) => desde === hasta ? a.x.nombre.localeCompare(b.x.nombre) : b.d.localeCompare(a.d));
      html = filas.map((r, i) => { const e = estado(r), s = r.q ? resumen(r.q) : null; return `<button type="button" class="fila-c ${e}" data-i="${i}" ${r.q ? '' : 'disabled'} style="animation-delay:${Math.min(i, 20) * 30}ms">
          <span class="luz ${e}" title="${TXT[e]}"></span>${desde === hasta ? avatar(r.x.nombre) : `<span class="avq fecha-q">${new Date(r.d + 'T12:00:00').getDate()}</span>`}
          <span class="t"><b>${esc(desde === hasta ? r.x.nombre : fechaLarga(r.d))}</b><small>${esc([delegDe(r.x), r.q && r.q.ruta].filter(Boolean).join(' · ') || r.x.rol || '')}</small></span>
          <span class="mini-res">${mini(s, r.q && conConf(r.q))}<span class="est ${e}">${TXT[e]}</span></span>${r.q ? ic('der') : ''}</button>`; }).join('');
    } else {
      // Varios días y todos los comerciales: una fila por persona con lo de todo el periodo; al tocarla, se ven sus días
      filas = [...new Set(vis.map(r => r.x))].sort((a, b) => a.nombre.localeCompare(b.nombre)).map(x => ({ x, rs: vis.filter(r => r.x === x) }));
      html = filas.map((f, i) => { const s = suma(f.rs), n = { si: cuenta(f.rs, 'si'), medio: cuenta(f.rs, 'medio'), no: cuenta(f.rs, 'no') };
        const e = n.no ? 'no' : n.medio ? 'medio' : n.si ? 'si' : 'antes';
        return `<button type="button" class="fila-c ${e}" data-i="${i}" style="animation-delay:${Math.min(i, 20) * 30}ms">
          <span class="luz ${e}"></span>${avatar(f.x.nombre)}
          <span class="t"><b>${esc(f.x.nombre)}</b><small>${esc(delegDe(f.x) || f.x.rol || '')}</small></span>
          <span class="mini-res">${mini(s, conConf({ tipo: f.x.tipo }))}<span class="est si">${n.si} firmadas</span>${n.medio ? `<span class="est medio">${n.medio} sin firmar</span>` : ''}${n.no ? `<span class="est no">${n.no} sin enviar</span>` : ''}</span>${ic('der')}</button>`; }).join('');
    }
    // «Descargar todo» e «Imprimir todo» (Juan, 25/11): solo administradores y «Ver todas» (dirección y administración)
    const conQ = vis.filter(r => r.q).sort((a, b) => a.d.localeCompare(b.d) || a.x.nombre.localeCompare(b.x.nombre)).map(r => r.q);

      : `<p class="vacio-q">${equipo.length ? 'No hay quinielas en estas fechas.' : JEFE ? 'Todavía no hay nadie de tu equipo (' + esc(K.equipoJefe || 'sin equipo') + ') con «Usuario» en QUINIELAS. Se pone en ACCESOS.' : 'Todavía no hay nadie con «Rellenar su quiniela». Dalo en ACCESOS a los comerciales y aquí aparecerá la lista de cada día.'}</p>`);

  const resTexto = (q, v) => esInst(q) ? [RES_INST[v.resultado] || '', v.demo && 'demo', v.ventaMant && 'venta de mantenimiento'].filter(Boolean).join(' · ')
    : resultadosDe(v).map(r => RES[r]).join(' + ') + (v.resultado === 'venta' ? (v.estado === 'pte' ? ' · Pendiente' : ' · Cerrada') : '');

      <div class="card bloque"><h2>Firma</h2>${q.firma ? `<img class="firma-img" src="${q.firma}" alt="Firma de ${esc(q.comercial)}"><p class="muted" style="font-size:13px;margin-top:6px">Firmada el ${new Date(q.firmada).toLocaleString('es-ES')}${q.firmadaPor ? ' por ' + esc(q.firmadaPor) + ', en nombre del comercial' : ''}${q.corregida ? `. Corregida después por ${esc(q.corregidaPor || 'un administrador')} el ${new Date(q.corregida).toLocaleString('es-ES')}` : ''}</p>` : '<p class="muted">Sin firmar todavía.</p>'}</div>`;
    app.querySelector('#volver').onclick = () => vistaDia();

  }

  /* =================== HOJAS DE PRODUCCIÓN (Juan, 24/11): una por equipo, con las columnas de su hoja en papel ===================
     Comerciales, VIP, consultores técnicos e instaladores salen solas de las quinielas.
     Teleoperadoras y mailing las rellena a mano su coordinadora (como el papel, pero digital). */
  const contar = (q, f) => q ? q.visitas.filter(f).length : 0;
  const hojaOrigenes = (os, conf) => os.flatMap(o => (conf ? [['conf', 'Conf']] : []).concat([['nulo', 'Nul'], ['demo', 'Demo'], ['venta', 'Vent']]).map(([r, t]) => ({ g: o, s: t, v: q => contar(q, x => x.origen === o && tiene(x, r)) })))
    .concat([{ g: 'Total ventas', s: '', v: q => contar(q, x => tiene(x, 'venta')) }]);
  const pct = (g, a, b) => ({ g, s: '%', pct: [a, b] });
  const MANUAL_TEL = ['Registros móviles', 'MKT'].flatMap(o => ['CED', 'NUL', 'ERR', 'NO LOC', 'PROD'].map(t => ({ g: o, s: t, m: true })));
  const MANUAL_MAIL = ['MKT', 'Demos com'].flatMap(o => ['CED', 'NUL', 'ERR', 'NO LOC', 'DEMO', 'VENT'].map(t => ({ g: o, s: t, m: true })));
  const HOJAS_DEF = {
    com: { nombre: 'Comerciales', deleg: true, cols: () => hojaOrigenes(ORIGENES_COM, true), texto: 'Sale sola de las quinielas: confirmados, nulos, demos y ventas de cada comercial por origen del cliente.' },
    vip: { nombre: 'VIP', cols: () => hojaOrigenes(ORIGENES_VIP), texto: 'Sale sola de las quinielas de los VIP, por sus orígenes.' },
    tec: { nombre: 'Consultores técnicos', cols: () => hojaOrigenes(ORIGENES_COM), texto: 'Sale sola de las quinielas de los consultores técnicos.' },
    inst: { nombre: 'Instaladores', texto: 'Sale sola de las quinielas de los instaladores, con las columnas de su cuadro.', cols: () => [
      { g: 'Instalaciones', s: '', v: q => q ? q.visitas.length : 0 },
      { g: 'Nulos', s: 'N.º', v: q => contar(q, x => x.resultado === 'nulo') }, pct('Nulos', 1, 0),
      { g: 'Realizadas', s: 'N.º', v: q => contar(q, x => x.resultado === 'hecha') }, pct('Realizadas', 3, 0),
      { g: 'Dispositivos', s: '', v: q => q ? q.visitas.reduce((t, x) => t + (x.articulos || []).filter(a => a.nombre).length, 0) : 0 },   // como en el cuadro (allí se escribe el aparato: Voqua…)
      { g: 'Demos', s: 'N.º', v: q => contar(q, x => x.demo) }, pct('Demos', 6, 0),
      { g: 'Venta mantenimiento', s: 'N.º', v: q => contar(q, x => x.ventaMant) }, pct('Venta mantenimiento', 8, 0)] },
    tel: { nombre: 'Teleoperadoras', manual: true, cols: () => MANUAL_TEL.concat([{ g: 'Total', s: '', suma: [4, 9] }]), texto: 'La rellena la coordinadora de teleoperadoras. Total = producidas de Registros móviles + MKT.' },
    mail: { nombre: 'Mailing', manual: true, cols: () => MANUAL_MAIL.concat([{ g: 'Total', s: '', suma: [5, 11] }]), texto: 'La rellena la coordinadora de mailing. Total = ventas de MKT + Demos com.' }
  };
  // De qué hoja es cada quiniela: por el equipo de su dueño (o, en las antiguas, por su tipo)
  const hojaDeQ = q => { const e = q.equipo || ''; const t = q.tipo || '';
    return e === 'VIP' || /VIP/i.test(t) ? 'vip' : e === 'Instaladores' || /Instalador/i.test(t) ? 'inst' : e === 'Consultores técnicos' || /Consultor/i.test(t) ? 'tec' : 'com'; };
  const hojaDeEquipo = e => ({ 'Córdoba': 'com', 'Alicante': 'com', 'VIP': 'vip', 'Consultores técnicos': 'tec', 'Instaladores': 'inst', 'Teleoperadoras': 'tel', 'Mailing': 'mail' })[e] || 'com';
  // Qué hojas ve cada uno
  const hojasVisibles = () => COORD ? [COORD] : GLOBAL ? ['com', 'vip', 'tec', 'inst', 'tel', 'mail'] : JEFE && K.equipoJefe ? [hojaDeEquipo(K.equipoJefe)] : ['com'];
  const puedeEditar = h => HOJAS_DEF[h].manual && (COORD === h || ADMIN);
  let hojaSel = null, modoHoja = 'semana', mesHoja = hoyISO().slice(0, 7);
  // Valor de cada columna en una fila (las de % y total se calculan con las demás)
  const completa = (cols, vals) => cols.map((c, k) => c.pct ? (vals[c.pct[1]] ? Math.round(100 * vals[c.pct[0]] / vals[c.pct[1]]) : null) : c.suma ? c.suma.reduce((t, i) => t + (vals[i] || 0), 0) : (vals[k] || 0));
  const sumaFilas = (cols, filas) => completa(cols, cols.map((c, k) => (c.pct || c.suma) ? 0 : filas.reduce((t, f) => t + (f[k] || 0), 0)));

  /* ---- Almacén de las hojas a mano: h/<hoja>/<lunes>.json, cifrado con la llave de las hojas ---- */
  async function leeHoja(h, lunes) {
    const r = await fetch(`${API}/contents/h/${h}/${lunes}.json?t=${Date.now()}`, { headers: H, cache: 'no-store' });
    if (r.status === 404) return { sha: null, dato: { v: 1, hoja: h, semana: lunes, datos: {} } };
    if (!r.ok) throw new Error('No se puede leer la hoja (' + r.status + ')');
    const j = await r.json(), env = JSON.parse(new TextDecoder().decode(u8(j.content.replace(/\n/g, ''))));
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(env.i) }, await aes(u8(K.hk), 'decrypt'), u8(env.c));
    return { sha: j.sha, dato: JSON.parse(new TextDecoder().decode(plano)) };
  }
  async function escribeHoja(h, lunes, dato, sha) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aes(u8(K.hk), 'encrypt'), new TextEncoder().encode(JSON.stringify(dato)));
    const r = await fetch(`${API}/contents/h/${h}/${lunes}.json`, { method: 'PUT', headers: H, body: JSON.stringify({ message: `Hoja ${h} ${lunes}`, content: b64(new TextEncoder().encode(JSON.stringify({ v: 1, i: b64(iv), c: b64(c) }))), ...(sha ? { sha } : {}) }) });
    if (r.status === 409 || r.status === 422) { const e = new Error('Esta hoja se ha cambiado desde otro dispositivo o por otra persona. Recarga la página para ver la última versión.'); e.conflicto = true; throw e; }
    if (!r.ok) throw new Error('No se ha podido guardar (' + r.status + '). Revisa la conexión.');
    return (await r.json()).content.sha;
  }

  async function vistaHoja() {
    const visibles = hojasVisibles();
    if (!visibles.includes(hojaSel)) hojaSel = visibles[0];
    const D = HOJAS_DEF[hojaSel], cols = D.cols();

    if (delegFija) delegFiltro = delegFija;
    marco(`<div class="card bloque no-imprimir">
        ${visibles.length > 1 ? `<div class="atajos">${visibles.map(h => `<button type="button" class="filtro-f ${h === hojaSel ? 'on' : ''}" data-h="${h}">${esc(HOJAS_DEF[h].nombre)}</button>`).join('')}</div>` : ''}

        ${modoHoja === 'semana' ? `<label class="c">Semana del<div class="dia"><button class="btn chico sec ic" type="button" id="ant" aria-label="Semana anterior">${ic('izq')}</button><input class="campo" type="date" id="fecha" value="${semana}"><button class="btn chico sec ic" type="button" id="sig" aria-label="Semana siguiente">${ic('der')}</button></div></label>`
          : `<label class="c">Mes<div class="dia"><button class="btn chico sec ic" type="button" id="ant" aria-label="Mes anterior">${ic('izq')}</button><input class="campo" type="month" id="fecha" value="${mesHoja}"><button class="btn chico sec ic" type="button" id="sig" aria-label="Mes siguiente">${ic('der')}</button></div></label>`}
        ${D.deleg && !delegFija ? `<label class="c">Delegación<select class="campo" id="deleg">${['Todas'].concat(DELEGACIONES).map(d => `<option ${d === delegFiltro ? 'selected' : ''}>${d}</option>`).join('')}</select></label>` : ''}</div>
        <div class="aviso-q info" style="margin:12px 0 0">${ic('info')}<span>${esc(D.texto)}${puedeEditar(hojaSel) && modoHoja === 'semana' ? ' Escribe los números en las casillas: se guarda solo.' : ''}</span></div></div>
      <div id="cuerpo"><p class="cargando">Preparando la hoja…</p></div>`);
    app.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { hojaSel = b.dataset.h; vistaHoja(); });
    app.querySelector('#modo').onchange = e => { modoHoja = e.target.value; vistaHoja(); };
    const f = app.querySelector('#fecha');
    const mueveMes = n => { const d = new Date(mesHoja + '-15T12:00:00'); d.setMonth(d.getMonth() + n); mesHoja = d.toISOString().slice(0, 7); vistaHoja(); };
    f.onchange = () => { if (!f.value) return; if (modoHoja === 'semana') semana = lunesDe(f.value); else mesHoja = f.value; vistaHoja(); };
    app.querySelector('#ant').onclick = () => modoHoja === 'semana' ? (semana = sumaDias(semana, -7), vistaHoja()) : mueveMes(-1);
    app.querySelector('#sig').onclick = () => modoHoja === 'semana' ? (semana = sumaDias(semana, 7), vistaHoja()) : mueveMes(1);
    const dl = app.querySelector('#deleg'); if (dl) dl.onchange = e => { delegFiltro = e.target.value; vistaHoja(); };

    // Días que entran: la semana (lunes a viernes) o los laborables del mes
    const dias = modoHoja === 'semana' ? semanaDias : diasEntre(mesHoja + '-01', finDeMes(mesHoja + '-01')).filter(laborable);
    // Filas: [nombre, valores por día]
    let personas = [], valor = () => null, datosHoja = null;
    try {
      if (D.manual) {
        personas = (K.hojas && K.hojas[hojaSel]) || [];
        const lunes = [...new Set(dias.map(lunesDe))], semanas = {};
        await Promise.all(lunes.map(async l => { semanas[l] = await leeHoja(hojaSel, l); }));
        if (modoHoja === 'semana') datosHoja = semanas[semana];
        valor = (p, d) => { const x = semanas[lunesDe(d)]; const v = x && x.dato.datos[p.uid] && x.dato.datos[p.uid][d]; return v ? completa(cols, v) : null; };
      } else {
        const rs = (await rutas(true)).filter(p => dias.some(d => p.endsWith(`/${d}.json`)));
        const qs = Object.values(await variasDe(rs)).filter(q => q && hojaDeQ(q) === hojaSel && (!D.deleg || delegFiltro === 'Todas' || q.delegacion === delegFiltro));
        // En el orden de la lista de ACCESOS (como en el papel) y, detrás, quien no esté en ella
        const lista = (K.equipo || []).map(m => m.nombre);
        const nombres = [...new Set(qs.map(q => q.comercial))].sort((a, b) => ((lista.indexOf(a) + 1) || 999) - ((lista.indexOf(b) + 1) || 999) || a.localeCompare(b));
        personas = nombres.map(n => ({ nombre: n }));
        valor = (p, d) => { const q = qs.find(x => x.comercial === p.nombre && x.fecha === d); return q ? completa(cols, cols.map(c => c.v ? c.v(q) : 0)) : null; };
      }
    } catch (e) { app.querySelector('#cuerpo').innerHTML = `<div class="aviso-q">${ic('info')}<span>${esc(e.message)}</span></div>`; return; }

    const editable = puedeEditar(hojaSel) && modoHoja === 'semana';
    const vacio = cols.map(() => null);
    const OG = { 'Registros móviles': 'og-reg', 'MKT': 'og-mkt' }, og = c => D.manual ? (OG[c.g] || '') : '';
    const celda = (c, x, k, ed, p, d) => ed && c.m ? `<td class="n ${og(c)} ${c.s === cols[0].s || (k && cols[k - 1].g !== c.g) ? 'bl' : ''}"><input class="num-h" inputmode="numeric" data-u="${esc(p.uid)}" data-d="${d}" data-k="${k}" value="${x == null || x === 0 && !((datosHoja.dato.datos[p.uid] || {})[d]) ? '' : x}" aria-label="${esc(p.nombre + ' ' + c.g + ' ' + c.s)}"></td>`
      : `<td class="n ${og(c)} ${k === 0 || cols[k - 1].g !== c.g ? 'bl' : ''} ${x ? '' : 'cero'}">${x == null ? '' : c.pct ? x + ' %' : x}</td>`;
    const fila = (p, vals, i, d, ed) => `<tr><td class="n">${i + 1}º</td><td>${esc(p.nombre)}</td>${(vals || vacio).map((x, k) => celda(cols[k], x, k, ed, p, d)).join('')}</tr>`;
    const totFila = (t, filas) => `<tr class="tot"><td></td><td>${t}</td>${sumaFilas(cols, filas).map((x, k) => celda(cols[k], x, k, false)).join('')}</tr>`;
    // Cabecera de dos filas: grupos y subcolumnas
    const grupos = []; cols.forEach(c => { const u = grupos[grupos.length - 1]; if (u && u.g === c.g) u.n++; else grupos.push({ g: c.g, n: 1, s: c.s }); });
    // Juan, 27/11: en la fila de cada día, los nombres de las columnas (CED, NUL…) encima de cada casilla, para rellenar más fácil
    const etiqueta = c => grupos.find(g => g.g === c.g).n === 1 && !c.s ? c.g : c.s;
    const filaDia = d => `<tr class="dia"><td colspan="2">${esc(fechaLarga(d))}</td>${cols.map((c, k) => `<td class="dl ${og(c)} ${k === 0 || cols[k - 1].g !== c.g ? 'bl' : ''}">${esc(etiqueta(c))}</td>`).join('')}</tr>`;
    let cuerpo = '';
    const totalesDia = [];
    if (modoHoja === 'semana') {
      for (const d of dias) {
        const vals = personas.map(p => valor(p, d) || (editable ? cols.map(() => 0) : null));
        totalesDia.push(sumaFilas(cols, vals.map(v => v || vacio)));
        cuerpo += filaDia(d) + personas.map((p, i) => fila(p, vals[i], i, d, editable)).join('') + totFila('Totales', vals.map(v => v || vacio));
      }
    } else {   // mes: una fila por persona con todo el mes
      const vals = personas.map(p => sumaFilas(cols, dias.map(d => valor(p, d) || vacio)));
      cuerpo = personas.map((p, i) => fila(p, vals[i], i, null, false)).join('');
      totalesDia.push(sumaFilas(cols, vals));
    }
    const totGeneral = sumaFilas(cols, totalesDia);
    const c = app.querySelector('#cuerpo');
    const titulo = `Hoja de producción · ${D.nombre}${D.deleg ? ' · ' + (delegFiltro === 'Todas' ? 'todas las delegaciones' : delegFiltro) : ''}`;
    const periodo = modoHoja === 'semana' ? 'Semana del ' + fechaLarga(semana) : 'Resumen de ' + new Date(mesHoja + '-15T12:00:00').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
    c.innerHTML = `<div class="q-cab" style="margin-top:4px"><div><h1 style="font-size:20px">${esc(titulo)}</h1><p>${esc(periodo)} · ${personas.length ? personas.length + ' personas' : D.manual ? 'todavía no hay nadie en esta hoja (se pone en ACCESOS: «Sale en la hoja de producción de»)' : 'todavía no hay quinielas'}</p></div>
        <div class="no-imprimir" style="display:flex;gap:8px;align-items:center"><span class="estado-g" id="estadoH"></span><button class="btn chico sec" type="button" id="csv">${ic('excel')}Descargar Excel</button><button class="btn chico sec" type="button" onclick="print()">${ic('imprimir')}Imprimir</button></div></div>
      <div class="tabla-c"><table class="t hoja-t"><thead><tr><th rowspan="2"></th><th rowspan="2">Nombre</th>${grupos.map(g => g.n === 1 && !g.s ? `<th class="g" rowspan="2">${esc(g.g)}</th>` : `<th class="g ${og(g)}" colspan="${g.n}">${esc(g.g)}</th>`).join('')}</tr>
        <tr>${cols.map((x, k) => (grupos.find(g => g.g === x.g).n === 1 && !x.s) ? '' : `<th class="n ${og(x)} ${k === 0 || cols[k - 1].g !== x.g ? 'bl' : ''}">${esc(x.s)}</th>`).join('')}</tr></thead>

  // Hoja a mano: cada número se guarda solo, a los pocos segundos
  function enlazaEdicion(c, x, cols) {
    let t = null, guardandoH = false, ultimaH = x.dato.guardada || '';
    const hH = hojaSel, lunesH = semana;   // la hoja y la semana de lo que se está editando (aunque luego se cambie de semana)
    const est = c.querySelector('#estadoH'), pon = s => { est.textContent = s; };
    pon(x.dato.guardada ? 'Guardada a las ' + new Date(x.dato.guardada).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '');
    const guardaH = async () => {
      if (guardandoH) { t = setTimeout(guardaH, 1500); return; }
      guardandoH = true; pon('Guardando…');
      try { x.dato.guardada = new Date().toISOString(); x.dato.quien = (Hub.sesion() || {}).nombre || ''; x.dato.disp = DISP;
        try { x.sha = await escribeHoja(hH, lunesH, x.dato, x.sha); }
        catch (e) {   // si lo último guardado es de esta pestaña o anterior a lo nuestro, se vuelve a guardar; si es de otro, se avisa
          if (!e.conflicto) throw e;
          const r = await leeHoja(hH, lunesH);
          if (r.sha && r.dato.disp !== DISP && (r.dato.guardada || '') > ultimaH) throw e;
          x.sha = await escribeHoja(hH, lunesH, x.dato, r.sha);
        }
        ultimaH = x.dato.guardada; pon('Guardada a las ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })); }
      catch (e) { pon(e.message); aviso(e.message, true); }
      guardandoH = false;
    };
    // Totales de cada fila, de cada día y de la semana, con lo que hay en las casillas
    const recalcula = () => {
      const filas = [...c.querySelectorAll('table.hoja-t tbody tr')], tots = filas.filter(tr => tr.classList.contains('tot'));
      let bloque = []; const dias = [];
      const pon = (tr, vals) => vals.forEach((v, i) => { const td = tr.children[2 + i]; if (!td.querySelector('input')) { td.textContent = v == null ? '' : cols[i].pct ? v + ' %' : v; td.classList.toggle('cero', !v); } });
      for (const tr of filas) {
        if (tr.classList.contains('dia')) continue;
        const ins = [...tr.querySelectorAll('.num-h')];
        if (ins.length) { const v = completa(cols, cols.map((col, i) => { const x = tr.children[2 + i].querySelector('input'); return x ? +x.value || 0 : 0; })); pon(tr, v); bloque.push(v); }
        else if (tr.classList.contains('tot')) {
          if (tr === tots[tots.length - 1]) pon(tr, sumaFilas(cols, dias));
          else { const t = sumaFilas(cols, bloque); pon(tr, t); dias.push(t); bloque = []; }
        }
      }
    };
    recalcula();
    c.querySelectorAll('.num-h').forEach(inp => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 4);
        const u = inp.dataset.u, d = inp.dataset.d, k = +inp.dataset.k;
        const fila = ((x.dato.datos[u] = x.dato.datos[u] || {})[d] = x.dato.datos[u][d] || cols.map(() => 0));
        fila[k] = inp.value === '' ? 0 : +inp.value;
        recalcula();   // totales al momento (sin repintar, para no perder el cursor)
        clearTimeout(t); t = setTimeout(guardaH, 2500); pon('Cambios sin guardar…');
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const todos = [...c.querySelectorAll('.num-h')]; const n = todos[todos.indexOf(inp) + 1]; if (n) n.focus(); } });
    });
    window.addEventListener('beforeunload', ev => { if (t) { guardaH(); ev.preventDefault(); ev.returnValue = ''; } });
  }

  const nuevoPdf = async () => { await carga('jspdf'); await carga('tabla'); return new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' }); };

  // «Descargar todo» (Juan, 25/11): todas las quinielas de la lista en un solo PDF, una detrás de otra (cada una en su página)

  function imprimeQuinielas(qs, boton) {

  // Excel de cualquier hoja de producción, con la estructura del papel: título, semana, cabecera de dos filas,
  // un bloque por día con su fila de totales y el total semanal (o, en el resumen del mes, una fila por persona). Con fórmulas.
  function excelHoja({ D, cols, personas, dias, valor, titulo, periodo }, boton) {
    return conEspera(boton, async () => {
      await carga('excel');
      const wb = new window.ExcelJS.Workbook(); wb.creator = 'Biofy Hub';
      const ws = wb.addWorksheet(D.nombre.toUpperCase().slice(0, 30), { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } } });
      const DIAS = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES'];
      const col = n => { let t = ''; while (n > 0) { const m = (n - 1) % 26; t = String.fromCharCode(65 + m) + t; n = Math.floor((n - 1) / 26); } return t; };
      const C0 = 4, ult = C0 + cols.length - 1;   // A día, B nº, C nombre, luego las columnas
      const fino = { style: 'thin', color: { argb: 'FF000000' } }, borde = { top: fino, left: fino, bottom: fino, right: fino };
      const gris = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } }, gris2 = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
      ws.columns = [{ width: 12 }, { width: 5 }, { width: 26 }].concat(cols.map(c => ({ width: c.g.length > 14 && cols.filter(x => x.g === c.g).length === 1 ? 14 : 8 })));
      ws.mergeCells(1, 1, 1, ult); ws.getCell(1, 1).value = 'HOJA DE PRODUCCIÓN ' + D.nombre.toUpperCase(); ws.getCell(1, 1).font = { bold: true, size: 14 }; ws.getCell(1, 1).alignment = { horizontal: 'center' };
      ws.mergeCells(2, 1, 2, 3); ws.getCell(2, 1).value = titulo.replace(/^Hoja de producción · /, '').toUpperCase(); ws.getCell(2, 1).font = { bold: true };
      ws.mergeCells(2, 4, 2, ult); ws.getCell(2, 4).value = periodo.toUpperCase(); ws.getCell(2, 4).font = { bold: true };
      // cabecera
      ws.mergeCells(3, 1, 4, 2); ws.mergeCells(3, 3, 4, 3); ws.getCell(3, 3).value = 'NOMBRE';
      let k = 0;
      while (k < cols.length) {
        let n = 1; while (k + n < cols.length && cols[k + n].g === cols[k].g) n++;
        const c1 = C0 + k;
        if (n === 1 && !cols[k].s) { ws.mergeCells(3, c1, 4, c1); ws.getCell(3, c1).value = cols[k].g.toUpperCase(); }
        else { if (n > 1) ws.mergeCells(3, c1, 3, c1 + n - 1); ws.getCell(3, c1).value = cols[k].g.toUpperCase(); for (let j = 0; j < n; j++) ws.getCell(4, c1 + j).value = cols[k + j].s.toUpperCase(); }
        k += n;
      }
      for (let rr = 3; rr <= 4; rr++) for (let cc = 1; cc <= ult; cc++) { const ce = ws.getCell(rr, cc); ce.fill = gris; ce.font = { bold: true, size: 9 }; ce.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; ce.border = borde; }
      // fórmulas de las columnas calculadas en una fila
      const calcula = fila => cols.forEach((c, i) => {
        const L = col(C0 + i);
        if (c.pct) { ws.getCell(fila, C0 + i).value = { formula: `IFERROR(${col(C0 + c.pct[0])}${fila}/${col(C0 + c.pct[1])}${fila},"")` }; ws.getCell(fila, C0 + i).numFmt = '0%'; }
        if (c.suma) ws.getCell(fila, C0 + i).value = { formula: `IF(COUNT(${c.suma.map(j => col(C0 + j) + fila).join(',')})=0,"",SUM(${c.suma.map(j => col(C0 + j) + fila).join(',')}))` };
        void L;
      });
      const sumaRango = (fila, desde, hasta) => cols.forEach((c, i) => { if (c.pct || c.suma) return; const L = col(C0 + i); ws.getCell(fila, C0 + i).value = { formula: `IF(COUNT(${L}${desde}:${L}${hasta})=0,"",SUM(${L}${desde}:${L}${hasta}))` }; });
      const sumaLista = (fila, filas) => cols.forEach((c, i) => { if (c.pct || c.suma) return; const L = col(C0 + i), refs = filas.map(f => L + f).join(','); ws.getCell(fila, C0 + i).value = { formula: `IF(COUNT(${refs})=0,"",SUM(${refs}))` }; });
      const pinta = (fila, gr) => { for (let cc = 1; cc <= ult; cc++) { ws.getCell(fila, cc).fill = gr; ws.getCell(fila, cc).font = { bold: true }; } };
      let fila = 5; const totales = [];
      const ponFila = (p, i, vals) => {
        ws.getCell(fila, 2).value = p ? (i + 1) + 'º' : ''; ws.getCell(fila, 3).value = p ? p.nombre : '';
        cols.forEach((c, j) => { if (!c.pct && !c.suma) ws.getCell(fila, C0 + j).value = vals && vals[j] ? vals[j] : null; });
        calcula(fila);
      };
      const semanal = dias.length <= 5;
      if (semanal) {
        dias.forEach((d, n) => {
          const ini = fila, filasDia = Math.max(personas.length, 1);
          for (let i = 0; i < filasDia; i++, fila++) ponFila(personas[i], i, personas[i] ? valor(personas[i], d) : null);
          ws.mergeCells(ini, 1, fila - 1, 1); ws.getCell(ini, 1).value = DIAS[n] + '\n' + fechaCorta(d);
          ws.getCell(ini, 1).alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; ws.getCell(ini, 1).font = { bold: true };
          ws.getCell(fila, 1).value = 'TOTALES'; sumaRango(fila, ini, fila - 1); calcula(fila); pinta(fila, gris2); ws.mergeCells(fila, 1, fila, 3);
          totales.push(fila); fila++;
        });
        ws.getCell(fila, 1).value = 'TOTAL SEMANAL'; sumaLista(fila, totales);
      } else {
        const ini = fila;
        personas.forEach((p, i) => { const tot = cols.map((c, j) => dias.reduce((t, d) => t + ((valor(p, d) || [])[j] || 0), 0)); ponFila(p, i, tot); fila++; });
        ws.getCell(fila, 1).value = 'TOTAL DEL MES'; if (personas.length) sumaRango(fila, ini, fila - 1);
      }
      calcula(fila); ws.mergeCells(fila, 1, fila, 3); pinta(fila, gris);
      for (let rr = 5; rr <= fila; rr++) for (let cc = 1; cc <= ult; cc++) { const ce = ws.getCell(rr, cc); ce.border = borde; if (cc > 3) ce.alignment = { horizontal: 'center', vertical: 'middle' }; }
      ws.views = [{ state: 'frozen', ySplit: 4 }];
      const buf = await wb.xlsx.writeBuffer();
      bajaBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Hoja de produccion ${D.nombre} ${semanal ? 'semana ' + dias[0] : dias[0].slice(0, 7)}.xlsx`);
    });
  }

  pinta();
});
</script>
