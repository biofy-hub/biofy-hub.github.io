<style>
#app{padding-bottom:40px}
.q-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 14px;animation:entra .5s var(--ease) both}
.q-cab h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.4px}
.q-cab p{color:var(--ink-3);margin-top:2px}
.pestanas{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow);flex-wrap:wrap}
.pestanas button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s}
.pestanas button svg{width:17px;height:17px}
.pestanas button.on{background:var(--brand);color:#fff}
.pestanas button:not(.on):hover{background:var(--surface-3)}
.bloque{padding:16px 18px;margin-bottom:14px;animation:entra .45s var(--ease) both}
.bloque h2 svg{width:16px;height:16px;color:var(--brand)}
.bloque h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.fila>*,.art>*,.c{min-width:0}
@media (max-width:600px){.fila.dr{grid-template-columns:1fr}}
.c .campo{width:100%;min-width:0}
.c{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.campo{height:44px;font-size:15px}
select.campo{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.dia{display:flex;align-items:center;gap:8px}
.dia .campo{flex:1;min-width:0}
.btn.chico{width:auto;height:44px;margin:0;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.btn.chico svg{width:17px;height:17px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{background:var(--surface-3);filter:none}
.btn.ic{width:44px;padding:0}
.btn.peligro{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface);transition:all .15s}
.seg input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.seg.res input[value="nulo"]:checked+span{background:var(--ink-3);border-color:var(--ink-3)}
.seg.res input[value="demo"]:checked+span{background:var(--warn);border-color:var(--warn)}
.seg.res input[value="venta"]:checked+span{background:var(--good);border-color:var(--good)}
/* Resumen */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.resumen div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;animation:pop .45s var(--ease) both}
.resumen small{display:block;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px}
.resumen b{font-size:22px;font-weight:800}
.resumen .ven b{color:var(--good)}
.resumen .dem b{color:var(--warn)}
/* Visitas */
.visitas{display:flex;flex-direction:column;gap:10px}
.visita{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;animation:entra .45s var(--ease) both}
.visita:hover{transform:translateY(-2px);box-shadow:var(--shadow-up);border-color:var(--line-2)}
.visita .n{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface-3);color:var(--ink-2)}
.visita.venta .n{background:var(--good-soft);color:var(--good)}
.visita.demo .n{background:var(--warn-soft);color:var(--warn)}
.visita .t{flex:1;min-width:0}
.visita b{display:block;font-size:15px}
.visita small{color:var(--ink-3);font-size:12.5px;display:block;margin-top:2px}
.visita .imp{font-weight:800;font-size:15px;white-space:nowrap}
.estado{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-top:6px}
.estado.nulo{background:var(--surface-3);color:var(--ink-2)}
.estado.demo{background:var(--warn-soft);color:var(--warn)}
.estado.venta{background:var(--good-soft);color:var(--good)}
.estado.pte{background:var(--brand-soft);color:var(--brand-ink)}
.vacio-q{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:14px}
.anadir{border:2px dashed var(--line-2);background:none;border-radius:16px;padding:14px;font-weight:700;color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;width:100%;transition:border-color .2s,background .2s}
.anadir:hover{border-color:var(--brand);background:var(--brand-soft)}
.anadir svg{width:18px;height:18px}
/* Firma */
.firma-caja{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.botones-q{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.estado-g{font-size:12.5px;color:var(--ink-3);margin-top:10px;display:flex;align-items:center;gap:6px;min-height:18px}
.estado-g svg{width:15px;height:15px;color:var(--good)}

.firma-img{background:#fff;border:1px solid var(--line);border-radius:12px;height:90px;padding:6px;max-width:260px}
.lienzo{width:100%;height:220px;background:#fff;border:2px dashed var(--line-2);border-radius:14px;touch-action:none;display:block;cursor:crosshair}
.aviso-q{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;margin-bottom:14px;background:var(--warn-soft);color:var(--warn);animation:entra .4s var(--ease) both}
.aviso-q.bien{background:var(--good-soft);color:var(--good)}
.aviso-q.info{background:var(--brand-soft);color:var(--brand-ink)}
.aviso-q svg{width:18px;height:18px;flex:none;margin-top:1px}
/* Barra inferior (guardar / firmar) */
.barra-q{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center}
.barra-q .estado-g{font-size:12.5px;color:var(--ink-3);margin-right:auto;max-width:1200px}
.barra-q .der{display:flex;gap:10px}
/* Jefes: lista del día */
.tarjetas-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tq{padding:16px;cursor:pointer;text-align:left;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;transition:transform .2s var(--ease),box-shadow .2s;animation:entra .5s var(--ease) both}
.tq:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.tq .cab{display:flex;align-items:center;gap:10px}
.tq .av{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none}
.tq h3{font-size:15px;font-weight:700;line-height:1.25}
.tq small{color:var(--ink-3);font-size:12.5px}
.mini-res{display:flex;gap:6px;flex-wrap:wrap}
.mini-res span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.mini-res span.v{background:var(--good-soft);color:var(--good)}
.mini-res span.d{background:var(--warn-soft);color:var(--warn)}
/* Lista de comerciales del día, con una luz: verde firmada, ámbar sin firmar, roja sin enviar */
.lista-c{padding:6px;display:flex;flex-direction:column}
.fila-c{display:flex;align-items:center;gap:12px;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;border-radius:12px;animation:entra .4s var(--ease) both;transition:background .15s}
.fila-c:last-child{border-bottom:0}
.fila-c:hover:not(:disabled){background:var(--surface-3)}
.fila-c:disabled{cursor:default}
.fila-c>svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.fila-c .t{flex:1;min-width:0}
.fila-c b{display:block;font-size:15px}
.fila-c small{color:var(--ink-3);font-size:12.5px}
.fila-c .mini-res{justify-content:flex-end}
.avq{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avq img{width:100%;height:100%;object-fit:cover}
.luz{width:12px;height:12px;border-radius:50%;flex:none}
.luz.si{background:#22a559;box-shadow:0 0 0 4px rgba(34,165,89,.18),0 0 10px rgba(34,165,89,.55)}
.luz.medio{background:#e8a21d;box-shadow:0 0 0 4px rgba(232,162,29,.18)}
.luz.antes{background:var(--line-2)}
.est.antes{background:var(--surface-3);color:var(--ink-3)}
.luz.no{background:#d93f3f;box-shadow:0 0 0 4px rgba(217,63,63,.15);animation:late 2s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 0 7px rgba(217,63,63,.05)}}
.est{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.est.si{background:var(--good-soft);color:var(--good)}
.est.medio{background:var(--warn-soft);color:var(--warn)}
.est.no{background:var(--bad-soft);color:var(--bad)}
@media (max-width:600px){.fila-c{flex-wrap:wrap}.fila-c .mini-res{width:100%;justify-content:flex-start;padding-left:24px}}
/* Tabla de detalle y hoja de producción */
.tabla-c{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
table.t td.n,table.t th.n{text-align:center}
table.t tr.tot td{font-weight:800;background:var(--surface-2)}
table.t tr.dia td{background:var(--brand-soft);color:var(--brand-ink);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.6px}
table.t th.g{text-align:center;border-left:1px solid var(--line)}
table.t td.bl{border-left:1px solid var(--line)}
.cero{color:var(--ink-3)}
.volver-q{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-bottom:12px;background:none;border:0;color:var(--brand);cursor:pointer;padding:6px 0}
.volver-q svg{width:17px;height:17px}
dialog{margin:auto;border:none;border-radius:var(--r);padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-up);width:min(640px,calc(100% - 20px));max-height:calc(100dvh - 20px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
dialog[open]{animation:pop .3s var(--ease) both}
dialog::backdrop{background:rgba(10,14,25,.5);backdrop-filter:blur(3px)}
dialog .dc{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog h2{font-size:19px;font-weight:800}
.art{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.art .ent{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.art .ent input{width:20px;height:20px;accent-color:var(--brand)}
.acciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.acciones .der{display:flex;gap:10px;margin-left:auto}
.solo-venta{display:none;flex-direction:column;gap:12px}
.es-venta .solo-venta{display:flex}
.error-q{color:var(--bad);font-size:13px;font-weight:600;min-height:16px}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--good);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-up);z-index:40;animation:pop .35s var(--ease) both;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.mal{background:var(--bad)}
.cargando{padding:60px 0;text-align:center;color:var(--ink-3)}
.pestanas .s{display:none}
@media (max-width:600px){.pestanas{display:flex;width:100%}.pestanas button{flex:1;justify-content:center;padding:8px 6px;font-size:13px}.pestanas .l{display:none}.pestanas .s{display:inline}.barra-q .estado-g{display:none}.barra-q .der{width:100%;min-width:0}.barra-q .der .btn{flex:1 1 0;min-width:0;padding:0 8px;font-size:13.5px;white-space:nowrap}}
/* Imprimir: la quiniela como en papel */
@media print{
  header.top,#hub-volver,.pestanas,.barra-q,.volver-q,.no-imprimir,.toast{display:none!important}
  body{background:#fff;color:#000}
  .bloque,.tabla-c{box-shadow:none;border-color:#999;animation:none}
  table.t{min-width:0;font-size:10px}
  @page{size:A4 landscape;margin:10mm}
}
</style>

<body>
<main class="wrap" id="app"><p class="cargando">Abriendo las quinielas…</p></main>
<dialog id="dlg"></dialog>
<script>
/* Módulo QUINIELAS (Juan, 23/11/2026): la quiniela diaria de cada comercial, firmada con el dedo,
   y la hoja de producción, que sale sola sumando las quinielas.
   Cada quiniela va CIFRADA en el repositorio privado: con la clave pública de los jefes (solo «Ver todas»
   tiene la privada) y con la llave propia del comercial (para que pueda releer la suya). Quien solo rellena
   no puede leer las de los demás. En GitHub solo se ve un nombre de archivo sin datos. */
Hub.listo.then(async function () {
  if (!Hub.sesion() || !Hub.puede('quinielas')) { location.replace('../index.html'); return; }
  Hub.cabecera('Quinielas', 'quiniela');
  const app = document.getElementById('app'), dlg = document.getElementById('dlg'), { esc } = Hub;
  const K = Hub.llave('quinielas');
  const sinLlave = t => { app.innerHTML = `<div class="card vacio"><div class="ic">${Hub.icono('quiniela')}</div><h1>Quinielas</h1><p>${t}</p></div>`; };
  if (!K || !K.t) return sinLlave('El módulo está en construcción: todavía no está conectado a su almacén de datos. Avisa a Claude.');
  const PERM = Hub.permiso('quinielas'), ADMIN = PERM === 'todas', JEFE = PERM === 'jefe', TODAS = !!K.priv;   // TODAS = admin o jefe
  let PARA = null;   // admins: la persona a la que se le rellena la quiniela (null = la propia)
  const propiaActual = () => PARA ? (PARA.qk || null) : K.propia;

  /* ---------- Listas (Juan, 23/11) ---------- */
  const ORIGENES = ['Registros móviles', 'MKT', 'Autocaptado', 'Guía'];
  const OFERTAS = ['Ultra', 'Plus', 'Bio', 'Minibio', 'Oferta recu'];
  const COBROS = ['Efectivo', 'TPV', 'Transferencia'];
  const ARTICULOS = ['Columbia de sobremesa', 'Voqua', 'Unik', 'Pure Black 12 L', 'Pure Black 25 L', 'Pure Water Top', 'Pure Water Pie', 'Technocal', 'Descalpro', 'HidroCal Pro', 'Icebox', 'Hydronic Pure', 'Elektra'];
  const DELEGACIONES = ['Córdoba', 'Alicante'];
  const RES = { nulo: 'Nulo', demo: 'Demo', venta: 'Venta' };

  /* ---------- Iconos ---------- */
  const I = {
    mia: '<path d="M9 4h6v3H9zM8 5.5H6v15h12v-15h-2M9 12h6M9 15.5h4"/>', dia: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
    hoja: '<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9h17M3.5 14h17M9 4v16M15 4v16"/>', mas: '<path d="M12 5v14M5 12h14"/>',
    izq: '<path d="M15 18l-6-6 6-6"/>', der: '<path d="M9 18l6-6-6-6"/>', firma: '<path d="M3 17c3-1 4-8 6-8s0 8 3 8 3-4 5-4 2 3 4 3"/><path d="M3 21h18"/>',
    guardar: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>', ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    imprimir: '<path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="6"/>',
    excel: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', borrar: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
  };
  const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

  /* ---------- Fechas ---------- */
  const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const sumaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const lunesDe = iso => { const d = new Date(iso + 'T12:00:00'); const w = (d.getDay() + 6) % 7; return sumaDias(iso, -w); };
  const fechaLarga = iso => { const t = new Date(iso + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); };
  const euros = n => (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const num = s => { const n = parseFloat(String(s || '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };

  /* ---------- Cifrado ---------- */
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = b => { let t = ''; const a = new Uint8Array(b); for (let i = 0; i < a.length; i += 8192) t += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(t); };
  const aes = (raw, uso) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, [uso]);
  async function cierra(obj) {
    const k = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aes(k, 'encrypt'), new TextEncoder().encode(JSON.stringify(obj)));
    // para los jefes: clave efímera ECDH + su clave pública
    const pub = await crypto.subtle.importKey('jwk', K.pub, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const eph = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
    const kj = await crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, eph.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    const ij = crypto.getRandomValues(new Uint8Array(12));
    const out = { v: 1, i: b64(iv), c: b64(c), j: { epk: await crypto.subtle.exportKey('jwk', eph.publicKey), i: b64(ij), c: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: ij }, kj, k)) } };
    const pr = propiaActual();   // la llave del dueño de la quiniela, para que él pueda releerla
    if (pr) { const ip = crypto.getRandomValues(new Uint8Array(12)); out.p = { i: b64(ip), c: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: ip }, await aes(u8(pr), 'encrypt'), k)) }; }
    return out;
  }
  async function abre(env) {
    let k = null;
    try {
      if (K.priv) {
        const priv = await crypto.subtle.importKey('jwk', K.priv, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']);
        const epk = await crypto.subtle.importKey('jwk', env.j.epk, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
        const kj = await crypto.subtle.deriveKey({ name: 'ECDH', public: epk }, priv, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        k = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(env.j.i) }, kj, u8(env.j.c));
      } else if (K.propia && env.p) k = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(env.p.i) }, await aes(u8(K.propia), 'decrypt'), u8(env.p.c));
      if (!k) return null;
      return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(env.i) }, await aes(k, 'decrypt'), u8(env.c))));
    } catch (e) { return null; }
  }
  // Carpeta de cada comercial: un código sacado de su identificador (no dice quién es).
  const carpeta = async uid => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('biofy-quinielas/' + uid)))].slice(0, 8).map(x => x.toString(16).padStart(2, '0')).join('');
  const MIA = await carpeta(K.uid);
  let CARP = MIA;   // carpeta de la quiniela que se está rellenando

  /* ---------- Almacén (repositorio privado) ---------- */
  const API = `https://api.github.com/repos/${K.o}/${K.r}`, H = { Authorization: 'Bearer ' + K.t, Accept: 'application/vnd.github+json' };
  async function lee(ruta) {
    const r = await fetch(`${API}/contents/${ruta}?t=${Date.now()}`, { headers: H, cache: 'no-store' });
    if (r.status === 404) return { sha: null, dato: null };
    if (!r.ok) throw new Error('No se puede leer (' + r.status + ')');
    const j = await r.json();
    return { sha: j.sha, dato: await abre(JSON.parse(new TextDecoder().decode(u8(j.content.replace(/\n/g, ''))))) };
  }
  async function escribe(ruta, obj, sha, msg) {
    const r = await fetch(`${API}/contents/${ruta}`, { method: 'PUT', headers: H, body: JSON.stringify({ message: msg, content: b64(new TextEncoder().encode(JSON.stringify({ ...(await cierra(obj)), f: obj.firmada ? 1 : 0 }))), ...(sha ? { sha } : {}) }) });
    if (r.status === 409 || r.status === 422) throw new Error('Se ha guardado desde otro aparato mientras tanto. Recarga la página.');
    if (!r.ok) throw new Error('No se ha podido guardar (' + r.status + '). Revisa la conexión.');
    return (await r.json()).content.sha;
  }
  async function lista() {   // todas las rutas de quinielas (solo nombres)
    const r = await fetch(`${API}/git/trees/HEAD?recursive=1&t=${Date.now()}`, { headers: H, cache: 'no-store' });
    if (!r.ok) return [];
    return (await r.json()).tree.filter(x => x.type === 'blob' && /^q\/[0-9a-f]+\/\d{4}-\d{2}-\d{2}\.json$/.test(x.path)).map(x => x.path);
  }

  /* ---------- Estado de la página ---------- */
  const pestanaValida = h => { if (!TODAS) return 'mia'; if (JEFE && (h === 'mia' || !h)) return 'dia'; return ['mia', 'dia', 'hoja'].includes(h) ? h : (JEFE ? 'dia' : 'mia'); };
  let pestana = pestanaValida(location.hash.replace(/^#\/?/, ''));
  let fecha = hoyISO(), Q = null, shaQ = null, cambios = false, semana = lunesDe(hoyISO()), delegFiltro = 'Todas', diaJefes = hoyISO();
  let guardando = false, tAuto = null, ultimoGuardado = null, sinRed = false;
  const nueva = () => ({ v: 1, uid: PARA ? PARA.uid : K.uid, comercial: PARA ? PARA.nombre : (K.nombreCompleto || Hub.sesion().nombre), delegacion: PARA ? '' : (Hub.lee('qn_deleg') || ''), fecha, ruta: '', visitas: [], firma: null, firmada: null, guardada: null });
  const resumen = q => {
    const v = q.visitas, ven = v.filter(x => x.resultado === 'venta');
    return { nulos: v.filter(x => x.resultado === 'nulo').length, demos: v.filter(x => x.resultado === 'demo').length, ventas: ven.length,
      conf: ven.filter(x => x.estado !== 'pte').length, pte: ven.filter(x => x.estado === 'pte').length,
      importe: ven.reduce((s, x) => s + num(x.importe), 0), cuota: ven.reduce((s, x) => s + num(x.cuota1), 0) };
  };
  const aviso = (t, mal) => { const d = document.createElement('div'); d.className = 'toast' + (mal ? ' mal' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); };

  function marco(contenido) {
    const tab = (id, ico, largo, corto) => `<button type="button" data-p="${id}" class="${pestana === id ? 'on' : ''}">${ic(ico)}<span class="l">${largo}</span><span class="s">${corto}</span></button>`;
    app.innerHTML = `<div class="q-cab"><div><h1>Quinielas</h1><p>${TODAS ? 'Seguimiento diario de los comerciales y producción de la semana' : 'Rellena tu quiniela durante el día y fírmala al terminar'}</p></div>
      ${TODAS ? `<div class="pestanas" role="tablist">${ADMIN ? tab('mia', 'mia', 'Mi quiniela', 'Mía') : ''}${tab('dia', 'dia', 'Quinielas del día', 'Del día')}${tab('hoja', 'hoja', 'Hoja de producción', 'Hoja')}</div>` : ''}</div>${contenido}`;
    app.querySelectorAll('.pestanas button').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.p; });
  }
  window.addEventListener('hashchange', () => { pestana = pestanaValida(location.hash.replace(/^#\/?/, '')); pinta(); });
  window.addEventListener('beforeunload', e => { if (cambios) { guarda(false, true); e.preventDefault(); e.returnValue = ''; } });
  function pinta() { document.querySelector('.barra-q')?.remove(); if (pestana === 'dia') return vistaDia(); if (pestana === 'hoja') return vistaHoja(); return vistaMia(); }

  /* =================== MI QUINIELA =================== */
  const borradorClave = () => 'qn_borrador_' + CARP + '_' + fecha;
  async function cargaMia() {
    clearTimeout(tAuto); Q = null; shaQ = null; cambios = false; ultimoGuardado = null;
    app.querySelector('#cuerpo').innerHTML = '<p class="cargando">Cargando la quiniela…</p>';
    try {
      const r = await lee(`q/${CARP}/${fecha}.json`);
      shaQ = r.sha; Q = r.dato; if (Q) ultimoGuardado = Q.guardada;
      if (r.sha && !r.dato) { app.querySelector('#cuerpo').innerHTML = '<div class="aviso-q">' + ic('info') + '<span>Esta quiniela existe, pero no se puede abrir con tu llave. Avisa a Claude.</span></div>'; return; }
    } catch (e) { aviso(e.message, true); }
    const b = Hub.lee(borradorClave());   // lo que quedó sin subir en este aparato (por ejemplo, sin conexión)
    if (b) { try { const x = JSON.parse(b); if (!Q || (x.guardada || '') > (Q.guardada || '')) { Q = x; cambios = true; programaGuardado(); } else Hub.guarda(borradorClave(), null); } catch (e) {} }
    if (!Q) Q = nueva();
    pintaMia();
    avisoAnterior();
  }
  // Aviso dentro del Hub: si la quiniela del día laborable anterior no está firmada, se avisa al abrir la de hoy.
  async function avisoAnterior() {
    if (fecha !== hoyISO() || PARA) return;
    let d = sumaDias(fecha, -1); while ([0, 6].includes(new Date(d + 'T12:00:00').getDay())) d = sumaDias(d, -1);
    let q = null; try { q = (await lee(`q/${CARP}/${d}.json`)).dato; } catch (e) { return; }
    if (q && q.firmada) return;
    // Solo desde que empezó a usar la quiniela digital: antes la rellenaba en papel y no se pasa (Juan, 23/11)
    const mias = (await rutas(true)).filter(x => x.startsWith(`q/${CARP}/`)).map(x => x.slice(-15, -5)).sort();
    if (!mias.length || d < mias[0]) return;
    const c = app.querySelector('#cuerpo'); if (!c || fecha !== hoyISO() || PARA) return;
    const div = document.createElement('div'); div.className = 'aviso-q';
    div.innerHTML = `${ic('info')}<span>${q ? 'Tu quiniela del ' : 'No has enviado la quiniela del '}<b>${esc(fechaLarga(d).toLowerCase())}</b>${q ? ' está sin firmar.' : '.'} <a href="#" id="irAnt">Ir a ese día</a></span>`;
    c.prepend(div);
    div.querySelector('#irAnt').onclick = e => { e.preventDefault(); cambiaDia(d); };
  }
  function vistaMia() {
    const equipo = ADMIN ? (K.equipo || []) : [];
    marco(`<div class="card bloque" style="animation-delay:40ms"><h2>${ic('dia')}Día y ruta</h2>
        <div class="fila dr">
          ${ADMIN ? `<label class="c">Quiniela de<select class="campo" id="para"><option value="">Yo (${esc(K.nombreCompleto || Hub.sesion().nombre)})</option>${equipo.map((m, i) => `<option value="${i}" ${PARA && PARA.uid === m.uid ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('')}</select></label>` : ''}
          <label class="c">Fecha<div class="dia"><button class="btn chico sec ic" type="button" id="ant" aria-label="Día anterior">${ic('izq')}</button><input class="campo" type="date" id="fecha" value="${fecha}" max="${hoyISO()}"><button class="btn chico sec ic" type="button" id="sig" aria-label="Día siguiente">${ic('der')}</button></div></label>
          <label class="c">Delegación<select class="campo" id="deleg"><option value="">Elige…</option>${DELEGACIONES.map(d => `<option>${d}</option>`).join('')}</select></label>
          <label class="c">Ruta<input class="campo" id="ruta" placeholder="Zona o pueblos de hoy" autocomplete="off"></label>
        </div>${ADMIN && !equipo.length ? '<p class="muted" style="font-size:12.5px;margin-top:8px">Para rellenar la de otra persona, primero dale «Usuario» en Quinielas desde ACCESOS.</p>' : ''}</div>
      <div id="cuerpo"></div>`);
    const f = app.querySelector('#fecha');
    f.onchange = () => cambiaDia(f.value);
    app.querySelector('#ant').onclick = () => cambiaDia(sumaDias(fecha, -1));
    app.querySelector('#sig').onclick = () => { if (fecha < hoyISO()) cambiaDia(sumaDias(fecha, 1)); };
    app.querySelector('#deleg').onchange = e => { Q.delegacion = e.target.value; if (!PARA) Hub.guarda('qn_deleg', e.target.value); toca(); };
    app.querySelector('#ruta').oninput = e => { Q.ruta = e.target.value; toca(); };
    const sp = app.querySelector('#para');
    if (sp) sp.onchange = async () => { await guardaYa(); PARA = sp.value === '' ? null : equipo[+sp.value]; CARP = PARA ? await carpeta(PARA.uid) : MIA; cargaMia(); };
    cargaMia();
  }
  async function cambiaDia(nuevaFecha) {
    if (!nuevaFecha || nuevaFecha === fecha) return;
    await guardaYa();
    fecha = nuevaFecha; app.querySelector('#fecha').value = fecha; cargaMia();
  }
  // Cada cambio se guarda solo, a los pocos segundos (y en el propio aparato al momento, por si no hay conexión).
  function toca(quitaFirma = true) {
    cambios = true;
    if (quitaFirma && Q.firma) { Q.firma = null; Q.firmada = null; Q.firmadaPor = null; }
    Q.guardada = new Date().toISOString();
    Hub.guarda(borradorClave(), JSON.stringify(Q));
    programaGuardado(); pintaEstado();
  }
  function programaGuardado() { clearTimeout(tAuto); tAuto = setTimeout(() => guarda(false, true), 5000); }   // 5 s: menos escrituras cuando lo usan muchos a la vez
  async function guardaYa() { clearTimeout(tAuto); if (cambios) await guarda(false, true); }
  function pintaEstado() {
    const e = app.querySelector('#estadoG'); if (!e) return;
    const hora = t => new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    e.className = 'estado-g' + (sinRed ? ' mal' : '');
    e.innerHTML = guardando ? 'Guardando…' : !Q.delegacion && cambios ? 'Elige la delegación para que se guarde' : sinRed ? 'Sin conexión: guardado en este aparato. Se subirá al volver la conexión.'
      : cambios ? 'Cambios pendientes de guardar…' : ultimoGuardado ? `${ic('ok')}Guardado a las ${hora(ultimoGuardado)}` : 'Todavía sin datos';
  }
  function pintaMia() {
    app.querySelector('#deleg').value = Q.delegacion || '';
    app.querySelector('#ruta').value = Q.ruta || '';
    const r = resumen(Q), c = app.querySelector('#cuerpo');
    c.innerHTML = `${PARA ? `<div class="aviso-q info">${ic('info')}<span>Estás rellenando la quiniela de <b>${esc(PARA.nombre)}</b>. Se guarda en la suya y quedará firmada por ti en su nombre.</span></div>` : ''}
      ${Q.firmada ? `<div class="aviso-q bien">${ic('ok')}<span>Firmada el ${new Date(Q.firmada).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}${Q.firmadaPor ? ' por ' + esc(Q.firmadaPor) : ''}. Si cambias algo, habrá que volver a firmarla.</span></div>` : ''}
      <div class="card bloque" style="animation-delay:80ms"><h2>${ic('hoja')}Resumen</h2><div class="resumen">
        <div><small>Visitas</small><b>${Q.visitas.length}</b></div><div><small>Nulos</small><b>${r.nulos}</b></div><div class="dem"><small>Demos</small><b>${r.demos}</b></div>
        <div class="ven"><small>Ventas</small><b>${r.ventas}</b></div><div><small>Confirmadas</small><b>${r.conf}</b></div>
        <div><small>Importe total</small><b style="font-size:17px">${euros(r.importe)}</b></div><div><small>1.ª cuota</small><b style="font-size:17px">${euros(r.cuota)}</b></div></div></div>
      <div class="card bloque" style="animation-delay:120ms"><h2>${ic('mia')}Visitas del día</h2>
        <div class="visitas">${Q.visitas.length ? Q.visitas.map((v, i) => tarjetaVisita(v, i)).join('') : '<p class="vacio-q">Todavía no hay visitas. Añádelas según las vayas haciendo.</p>'}
        <button class="anadir" type="button" id="anadir">${ic('mas')}Añadir visita</button></div></div>
      <div class="card bloque" style="animation-delay:160ms"><h2>${ic('firma')}Firma</h2>
        <div class="firma-caja">${Q.firma ? `<img class="firma-img" src="${Q.firma}" alt="Firma">` : '<p class="muted" style="font-size:14px">Sin firmar. Puedes ir rellenándola durante el día (se guarda sola) y firmarla al terminar.</p>'}</div>
        <div class="botones-q"><button class="btn chico" type="button" id="firmar2">${ic('firma')}${Q.firmada ? 'Volver a firmar' : 'Firmar y enviar'}</button>
          ${shaQ || Q.visitas.length ? `<button class="btn chico sec" type="button" id="pdf2">${ic('excel')}Descargar PDF</button>` : ''}</div>
        <p class="estado-g" id="estadoG"></p></div>
      ${PARA ? '' : '<div class="card bloque no-imprimir" id="avisos" style="animation-delay:200ms"></div>'}`;
    c.querySelectorAll('.visita').forEach(b => b.onclick = () => editaVisita(+b.dataset.i));
    c.querySelector('#anadir').onclick = () => editaVisita(null);
    c.querySelector('#firmar2').onclick = pideFirma;
    const bp = c.querySelector('#pdf2'); if (bp) bp.onclick = () => pdfQuiniela(Q, bp);
    pintaEstado(); pintaAvisos();
  }
  function tarjetaVisita(v, i) {
    const arts = (v.articulos || []).filter(a => a.nombre).map(a => a.nombre + (a.entrega ? ' ✓' : '')).join(' · ');
    return `<button type="button" class="visita ${v.resultado}" data-i="${i}" style="animation-delay:${i * 40}ms"><span class="n">${i + 1}</span>
      <span class="t"><b>${esc(v.cliente || 'Sin nombre')}</b><small>${esc([v.poblacion, v.origen, v.oferta].filter(Boolean).join(' · '))}</small>${arts ? `<small>${esc(arts)}</small>` : ''}
      <span class="estado ${v.resultado}">${RES[v.resultado] || '—'}</span>${v.resultado === 'venta' ? ` <span class="estado ${v.estado === 'pte' ? 'pte' : 'venta'}">${v.estado === 'pte' ? 'Pendiente' : 'Confirmada'}</span>` : ''}</span>
      ${v.resultado === 'venta' ? `<span class="imp">${euros(num(v.importe))}</span>` : ''}</button>`;
  }
  const pintaBarra = pintaEstado;

  /* ---------- Avisos en el móvil (Juan, 23/11): a las 20:00, de lunes a viernes, a quien no la haya registrado ---------- */
  const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const instalada = () => Hub.enIcono();
  const disp = () => { let d = Hub.lee('qn_disp'); if (!d) { d = [...crypto.getRandomValues(new Uint8Array(6))].map(x => x.toString(16).padStart(2, '0')).join(''); Hub.guarda('qn_disp', d); } return d; };
  const b64url = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
  async function pintaAvisos() {
    const el = app.querySelector('#avisos'); if (!el) return;
    const cab = `<h2>${ic('info')}Avisos en este móvil</h2>`;
    if (!K.vapid) { el.remove(); return; }
    if (esIOS && !instalada()) {
      el.innerHTML = cab + `<p style="font-size:14px">Para recibir un aviso a las 20:00 si todavía no has registrado tu quiniela, en el iPhone primero hay que añadir el Hub a la pantalla de inicio (una sola vez) y abrirlo desde ese icono. Luego vuelve aquí y pulsa «Activar avisos».</p>
        <p class="muted" style="font-size:13px">¿Ya lo tienes en la pantalla de inicio? Ciérralo aquí y ábrelo desde el icono del Hub.</p>
        <div class="botones-q"><button class="btn chico" type="button" id="inicioIOS">${ic('info')}Añadir a la pantalla de inicio</button></div>`;
      el.querySelector('#inicioIOS').onclick = Hub.anadirInicio;
      return;
    }
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) { el.innerHTML = cab + '<p class="muted" style="font-size:14px">Este navegador no admite avisos. Prueba con Chrome (Android) o Safari (iPhone).</p>'; return; }
    let activo = false;
    try { const reg = await navigator.serviceWorker.getRegistration(Hub.raiz); activo = !!(reg && await reg.pushManager.getSubscription()) && Notification.permission === 'granted' && Hub.lee('qn_avisos') === MIA; } catch (e) {}
    el.innerHTML = cab + (activo
      ? `<p style="font-size:14px;display:flex;gap:8px;align-items:center"><span class="luz si"></span>Activados. Si a las 20:00 (de lunes a viernes) todavía no has registrado tu quiniela, te llegará un aviso a este móvil.</p>`
      : Notification.permission === 'denied'
        ? '<p style="font-size:14px">Los avisos están bloqueados en este móvil. Actívalos en los ajustes del navegador (notificaciones de biofy-hub.github.io) y vuelve aquí.</p>'
        : `<p style="font-size:14px">Si a las 20:00 (de lunes a viernes) todavía no has registrado tu quiniela, te llega un aviso a este móvil. Solo hay que activarlo una vez.</p>
           <div class="botones-q"><button class="btn chico" type="button" id="activar">${ic('info')}Activar avisos</button></div>`);
    const b = el.querySelector('#activar'); if (b) b.onclick = () => activaAvisos(b);
  }
  async function activaAvisos(boton) {
    boton.disabled = true; boton.textContent = 'Activando…';
    try {
      if (await Notification.requestPermission() !== 'granted') throw new Error('Sin permiso: hay que aceptar las notificaciones.');
      const reg = await navigator.serviceWorker.register(Hub.raiz + 'sw.js', { scope: Hub.raiz });
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64url(K.vapid) });
      const j = sub.toJSON(), ruta = `avisos/${MIA}/${disp()}.json`;
      let sha = null; try { const x = await fetch(`${API}/contents/${ruta}?t=${Date.now()}`, { headers: H, cache: 'no-store' }); if (x.ok) sha = (await x.json()).sha; } catch (e) {}
      const r = await fetch(`${API}/contents/${ruta}`, { method: 'PUT', headers: H, body: JSON.stringify({ message: 'Avisos: móvil activado', content: b64(new TextEncoder().encode(JSON.stringify({ endpoint: j.endpoint, keys: j.keys, alta: new Date().toISOString() }))), ...(sha ? { sha } : {}) }) });
      if (!r.ok) throw new Error('No se ha podido guardar (' + r.status + ').');
      Hub.guarda('qn_avisos', MIA);
      aviso('Avisos activados en este móvil.');
    } catch (e) { aviso(e.message || 'No se han podido activar los avisos.', true); }
    pintaAvisos();
  }   // (antes había una barra abajo; ahora el estado va junto a la firma)
  async function guarda(conFirma, silencioso) {
    if (!Q || !cambios && !conFirma) return true;
    if (!Q.delegacion) { if (!silencioso) aviso('Elige la delegación antes de firmar.', true); pintaEstado(); return false; }
    if (guardando) { if (!conFirma) { programaGuardado(); return false; } while (guardando) await new Promise(z => setTimeout(z, 200)); }
    guardando = true; pintaEstado();
    const ruta = `q/${CARP}/${fecha}.json`, copia = JSON.stringify(Q);
    try {
      shaQ = await escribe(ruta, Q, shaQ, `Quiniela ${fecha}${conFirma ? ' (firmada)' : ''}`);
      guardando = false; sinRed = false; ultimoGuardado = Q.guardada;
      if (JSON.stringify(Q) === copia) { cambios = false; Hub.guarda(borradorClave(), null); } else programaGuardado();
      if (conFirma) { aviso('Quiniela firmada y enviada.'); pintaMia(); } else pintaEstado();
      return true;
    } catch (e) {
      guardando = false; sinRed = !navigator.onLine || /conexión/i.test(e.message);
      if (!silencioso || conFirma) aviso(e.message, true);
      if (sinRed) setTimeout(programaGuardado, 15000);
      pintaEstado(); return false;
    }
  }
  window.addEventListener('online', () => { if (cambios) programaGuardado(); });

  /* ---------- Una visita ---------- */
  function editaVisita(i) {
    const v = i === null ? { cliente: '', poblacion: '', origen: '', oferta: '', resultado: '', estado: 'conf', articulos: [{}, {}, {}, {}], importe: '', cuota1: '', cobro: '', cuotas: '' } : JSON.parse(JSON.stringify(Q.visitas[i]));
    while ((v.articulos || (v.articulos = [])).length < 4) v.articulos.push({});
    const radios = (n, ops, val, cls = '') => `<div class="seg ${cls}">${ops.map(([k, t]) => `<label><input type="radio" name="${n}" value="${esc(k)}" ${val === k ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>`;

  /* ---------- Firma con el dedo ---------- */
  function pideFirma() {
    if (!Q.delegacion) { aviso('Elige tu delegación antes de firmar.', true); return; }
    if (!Q.visitas.length && !confirm('No hay visitas. ¿Firmar la quiniela vacía?')) return;
    dlg.innerHTML = `<div class="dc"><h2>Firma tu quiniela</h2><p class="muted" style="font-size:14px">${esc(fechaLarga(fecha))} · ${Q.visitas.length} visita${Q.visitas.length === 1 ? '' : 's'}. Firma con el dedo (o el ratón) dentro del recuadro.</p>
      <canvas class="lienzo" id="lienzo"></canvas>
      <div class="acciones"><button class="btn chico sec" type="button" id="limpiar">${ic('borrar')}Borrar</button>
        <div class="der"><button class="btn chico sec" type="button" id="cancelar">Cancelar</button><button class="btn chico" type="button" id="ok" disabled>${ic('ok')}Firmar y enviar</button></div></div></div>`;
    dlg.showModal();
    const cv = dlg.querySelector('#lienzo'), ctx = cv.getContext('2d'), ok = dlg.querySelector('#ok');
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1d23';
    let dibuja = false, trazos = 0, ult = null;
    const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { dibuja = true; ult = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(ult[0], ult[1], 1.2, 0, 7); ctx.fillStyle = '#1b1d23'; ctx.fill(); };
    cv.onpointermove = e => { if (!dibuja) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(ult[0], ult[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ult = p; trazos++; if (trazos > 8) ok.disabled = false; };
    cv.onpointerup = cv.onpointercancel = () => { dibuja = false; };
    dlg.querySelector('#limpiar').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); trazos = 0; ok.disabled = true; };
    dlg.querySelector('#cancelar').onclick = () => dlg.close();
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = 'Enviando…';
      // la firma, recortada a lo dibujado y en PNG
      Q.firma = cv.toDataURL('image/png'); Q.firmada = new Date().toISOString(); Q.firmadaPor = PARA ? (K.nombreCompleto || Hub.sesion().nombre) : null; cambios = true;
      if (await guarda(true)) dlg.close(); else { ok.disabled = false; ok.innerHTML = ic('ok') + 'Firmar y enviar'; Q.firma = null; Q.firmada = null; }
    };
  }

  /* =================== QUINIELAS DEL DÍA (ver todas) =================== */
  let RUTAS = null, CACHE = {};
  async function rutas(forzar) { if (!RUTAS || forzar) RUTAS = await lista(); return RUTAS; }
  async function quinielaDe(ruta) { if (!CACHE[ruta]) CACHE[ruta] = lee(ruta).then(r => r.dato).catch(() => null); return CACHE[ruta]; }
  async function vistaDia() {
    marco(`<div class="card bloque no-imprimir"><div class="fila">

    const porCarpeta = {}; for (const p of rs) porCarpeta[p.split('/')[1]] = p;
    const filas = [];
    for (const m of equipo) filas.push({ nombre: m.nombre, rol: [m.tipo, m.rol].filter(Boolean).join(' · '), ruta: porCarpeta[m.carpeta] || null, antes: !primera[m.carpeta] || diaJefes < primera[m.carpeta] });
    for (const [carp, p] of Object.entries(porCarpeta)) if (!equipo.some(m => m.carpeta === carp)) filas.push({ nombre: null, rol: '', ruta: p });

    const vis = filas.filter(f => delegFiltro === 'Todas' || !delegDe(f) || delegDe(f) === delegFiltro).sort((x, y) => x.nombre.localeCompare(y.nombre));
    const estado = f => f.q ? (f.q.firmada ? 'si' : 'medio') : f.antes ? 'antes' : 'no';
    const TXT = { si: 'Enviada y firmada', medio: 'Guardada, sin firmar', no: 'Sin enviar', antes: 'Aún no usaba la digital' };
    const qs = vis.map(f => f.q).filter(Boolean);
    const c = app.querySelector('#cuerpo'), tot = qs.reduce((t, q) => { const r = resumen(q); for (const k in r) t[k] = (t[k] || 0) + r[k]; return t; }, {});
    const nSi = vis.filter(f => estado(f) === 'si').length, nMedio = vis.filter(f => estado(f) === 'medio').length, nNo = vis.filter(f => estado(f) === 'no').length;
    c.innerHTML = `<div class="card bloque"><h2>${ic('hoja')}${esc(fechaLarga(diaJefes))}</h2><div class="resumen">
        <div class="ven"><small>Firmadas</small><b>${nSi}</b></div><div class="dem"><small>Sin firmar</small><b>${nMedio}</b></div><div><small>Sin enviar</small><b style="color:var(--bad)">${nNo}</b></div>
        <div><small>Nulos</small><b>${tot.nulos || 0}</b></div><div><small>Demos</small><b>${tot.demos || 0}</b></div><div><small>Ventas</small><b>${tot.ventas || 0}</b></div><div><small>Importe</small><b style="font-size:17px">${euros(tot.importe)}</b></div></div></div>
      ${vis.length ? `<div class="card lista-c">${vis.map((f, i) => { const e = estado(f), r = f.q ? resumen(f.q) : null; return `<button type="button" class="fila-c ${e}" data-i="${i}" ${f.q ? '' : 'disabled'} style="animation-delay:${i * 35}ms">
          <span class="luz ${e}" title="${TXT[e]}"></span><span class="avq" data-n="${esc(f.nombre)}">${esc((f.nombre || '?').trim()[0])}</span>
          <span class="t"><b>${esc(f.nombre)}</b><small>${esc([delegDe(f), f.q && f.q.ruta].filter(Boolean).join(' · ') || f.rol || '')}</small></span>
          <span class="mini-res">${r ? `<span>${r.nulos} nulos</span><span class="d">${r.demos} demos</span><span class="v">${r.ventas} ventas</span>` : ''}<span class="est ${e}">${TXT[e]}</span></span>
          ${f.q ? ic('der') : ''}</button>`; }).join('')}</div>`
        : `<p class="vacio-q">Todavía no hay nadie con «Rellenar su quiniela». Dalo en ACCESOS a los comerciales${qs.length ? '' : ' y aquí aparecerá la lista de cada día'}.</p>`}`;
    c.querySelectorAll('.fila-c').forEach(b => b.onclick = () => { const f = vis[+b.dataset.i]; if (f.q) detalle(f.q); });
    c.querySelectorAll('.avq').forEach(a => Hub.foto(a.dataset.n).then(u => { if (u) a.innerHTML = `<img src="${u}" alt="">`; }));

  /* =================== HOJA DE PRODUCCIÓN (sale de las quinielas) =================== */
  async function vistaHoja() {
    const dias = [0, 1, 2, 3, 4].map(n => sumaDias(semana, n));
    marco(`<div class="card bloque no-imprimir"><div class="fila">
        <label class="c">Semana del<div class="dia"><button class="btn chico sec ic" type="button" id="ant" aria-label="Semana anterior">${ic('izq')}</button><input class="campo" type="date" id="fecha" value="${semana}"><button class="btn chico sec ic" type="button" id="sig" aria-label="Semana siguiente">${ic('der')}</button></div></label>
        <label class="c">Delegación<select class="campo" id="deleg">${['Todas'].concat(DELEGACIONES).map(d => `<option ${d === delegFiltro ? 'selected' : ''}>${d}</option>`).join('')}</select></label></div>
        <div class="aviso-q info" style="margin:12px 0 0">${ic('info')}<span>Sale sola de las quinielas guardadas: nulos, demos y ventas de cada comercial por origen del cliente.</span></div></div>
      <div id="cuerpo"><p class="cargando">Sumando las quinielas de la semana…</p></div>`);
    const f = app.querySelector('#fecha');
    f.onchange = () => { semana = lunesDe(f.value); vistaHoja(); };
    app.querySelector('#ant').onclick = () => { semana = sumaDias(semana, -7); vistaHoja(); };
    app.querySelector('#sig').onclick = () => { semana = sumaDias(semana, 7); vistaHoja(); };
    app.querySelector('#deleg').onchange = e => { delegFiltro = e.target.value; vistaHoja(); };
    const rs = (await rutas(true)).filter(p => dias.some(d => p.endsWith(`/${d}.json`)));
    CACHE = {};
    const qs = (await Promise.all(rs.map(quinielaDe))).filter(q => q && (delegFiltro === 'Todas' || q.delegacion === delegFiltro));
    const comerciales = [...new Set(qs.map(q => q.comercial))].sort((a, b) => a.localeCompare(b));
    const cuenta = (q, o, res) => q ? q.visitas.filter(v => v.origen === o && v.resultado === res).length : 0;
    const filaDe = q => ORIGENES.flatMap(o => ['nulo', 'demo', 'venta'].map(res => cuenta(q, o, res))).concat(q ? q.visitas.filter(v => v.resultado === 'venta').length : 0);
    const suma = filas => filas.reduce((t, f) => t.map((x, k) => x + f[k]), new Array(ORIGENES.length * 3 + 1).fill(0));
    const celdas = f => f.map((x, k) => `<td class="n ${k % 3 === 0 && k < f.length - 1 ? 'bl' : ''} ${k === f.length - 1 ? 'bl' : ''} ${x ? '' : 'cero'}">${x}</td>`).join('');
    const filasSemana = [];

    for (const d of dias) {

      cuerpo += `<tr class="dia"><td colspan="${3 + ORIGENES.length * 3}">${esc(fechaLarga(d))}</td></tr>` + delDia.map(([n, f], i) => `<tr><td class="n">${i + 1}º</td><td>${esc(n)}</td>${celdas(f)}</tr>`).join('') + `<tr class="tot"><td></td><td>Totales</td>${celdas(tot)}</tr>`;
    }
    const totSem = suma(filasSemana);
    const c = app.querySelector('#cuerpo');
    c.innerHTML = `<div class="q-cab" style="margin-top:4px"><div><h1 style="font-size:20px">Hoja de producción · ${esc(delegFiltro === 'Todas' ? 'todas las delegaciones' : delegFiltro)}</h1><p>Semana del ${esc(fechaLarga(semana))} · ${comerciales.length ? comerciales.length + ' comerciales' : 'todavía no hay quinielas guardadas esta semana'}</p></div>
        <div class="no-imprimir" style="display:flex;gap:8px"><button class="btn chico sec" type="button" id="csv">${ic('excel')}Descargar Excel</button><button class="btn chico sec" type="button" onclick="print()">${ic('imprimir')}Imprimir</button></div></div>
      <div class="tabla-c"><table class="t"><thead><tr><th rowspan="2"></th><th rowspan="2">Nombre</th>${ORIGENES.map(o => `<th class="g" colspan="3">${esc(o)}</th>`).join('')}<th class="g" rowspan="2">Total ventas</th></tr>
        <tr>${ORIGENES.map(() => '<th class="n bl">Nul</th><th class="n">Demo</th><th class="n">Vent</th>').join('')}</tr></thead>
        <tbody>${cuerpo}<tr class="dia"><td colspan="${3 + ORIGENES.length * 3}">Total semanal</td></tr><tr class="tot"><td></td><td>Total</td>${celdas(totSem)}</tr></tbody></table></div>`;
    c.querySelector('#csv').onclick = e => excelHoja(qs, dias, filaDe, e.currentTarget);
  }

  /* =================== DESCARGAS (Juan, 23/11): PDF de cada quiniela y Excel de la hoja, como los originales =================== */
  // Librerías conocidas, cargadas solo al descargar y con su huella (integrity): el navegador rechaza cualquier copia cambiada.
  const LIBS = {
    jspdf: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk'],
    tabla: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js', 'sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3'],
    excel: ['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js', 'sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz']
  };
  const cargadas = {};
  const carga = n => cargadas[n] || (cargadas[n] = new Promise((ok, mal) => {
    const sc = document.createElement('script'); sc.src = LIBS[n][0]; sc.integrity = LIBS[n][1]; sc.crossOrigin = 'anonymous';
    sc.onload = ok; sc.onerror = () => { delete cargadas[n]; mal(new Error('No se ha podido preparar la descarga. Revisa la conexión.')); };
    document.head.appendChild(sc);
  }));
  const bajaBlob = (blob, nombre) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); };
  const fechaCorta = iso => iso.split('-').reverse().join('/');
  async function conEspera(boton, fn) {

  }

  // PDF de una quiniela, con la forma de la «Quiniela diaria» en papel (A4 apaisado)
  function pdfQuiniela(q, boton) {
    return conEspera(boton, async () => {
      await carga('jspdf'); await carga('tabla');
      const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const N = '#000000', G = [217, 217, 217];
      // Cabecera: recuadros como en el papel y el logo a la derecha
      doc.setDrawColor(N); doc.setLineWidth(0.3);
      doc.rect(10, 10, 140, 8); doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.text('QUINIELA DIARIA', 80, 15.6, { align: 'center' });
      doc.setFontSize(9);
      const fila = (y, et, val, w) => { doc.rect(10, y, w, 6.5); doc.setFont('helvetica', 'bold'); doc.text(et, 11.5, y + 4.5); doc.setFont('helvetica', 'normal'); doc.text(String(val || ''), 11.5 + doc.getTextWidth(et) + 2, y + 4.5); };
      fila(19, 'COMERCIAL:', q.comercial + (q.delegacion ? ' (' + q.delegacion + ')' : ''), 140);
      fila(26.5, 'FECHA:', fechaCorta(q.fecha), 80);
      fila(34, 'RUTA:', q.ruta, 140);
      try { const L = await logoPng(); doc.addImage(L.url, 'PNG', 210, 11, 75, 75 * L.r); } catch (e) {}
      // Tabla de visitas (como mínimo 10 filas, igual que el papel)
      const X = b => b ? 'X' : '';
      const filas = q.visitas.map(v => {
        const a = v.articulos || [], art = k => (a[k] && a[k].nombre) || '', ent = k => X(a[k] && a[k].entrega), venta = v.resultado === 'venta';
        return [v.cliente, v.poblacion, v.oferta, v.origen, art(0), ent(0), art(1), ent(1), art(2), ent(2), art(3), ent(3),
          venta ? euros(num(v.importe)) : '', venta ? euros(num(v.cuota1)) : '', venta ? v.cobro || '' : '', venta ? v.cuotas || '' : '',
          X(venta && v.estado !== 'pte'), X(v.resultado === 'nulo'), X(v.resultado === 'demo'), X(venta && v.estado === 'pte')];
      });
      while (filas.length < 10) filas.push(new Array(20).fill(''));
      const r = resumen(q);
      filas.push([{ content: 'TOTAL', colSpan: 12, styles: { halign: 'right', fontStyle: 'bold' } }, { content: euros(r.importe), styles: { fontStyle: 'bold' } }, { content: euros(r.cuota), styles: { fontStyle: 'bold' } }, { content: '', colSpan: 6 }]);
      doc.autoTable({
        startY: 44, margin: { left: 10, right: 10 }, theme: 'grid',
        head: [['NOMBRE', 'POBLACIÓN', 'TIPO\nOFERTA', 'ORIGEN\nCLIENTE', 'ARTÍCULO 1', 'ENTREGA', 'ARTÍCULO 2', 'ENTREGA', 'ARTÍCULO 3', 'ENTREGA', 'ARTÍCULO 4', 'ENTREGA', 'IMPORTE\nTOTAL', '1ª CUOTA', 'FORMA\nCOBRO', 'Nº\nCUOTAS', 'CONF', 'NULO', 'DEMO', 'PTE']],
        body: filas,
        styles: { font: 'helvetica', fontSize: 6.6, cellPadding: 1.1, lineColor: N, lineWidth: 0.2, textColor: N, valign: 'middle', minCellHeight: 6.2 },
        headStyles: { fillColor: G, textColor: N, fontStyle: 'bold', halign: 'center', fontSize: 5.8, cellPadding: 0.7 },
        columnStyles: { 0: { cellWidth: 32 }, 1: { cellWidth: 18 }, 2: { cellWidth: 11, halign: 'center' }, 3: { cellWidth: 15, halign: 'center' }, 5: { cellWidth: 12.5, halign: 'center' }, 7: { cellWidth: 12.5, halign: 'center' }, 9: { cellWidth: 12.5, halign: 'center' }, 11: { cellWidth: 12.5, halign: 'center' }, 12: { cellWidth: 15, halign: 'right' }, 13: { cellWidth: 13, halign: 'right' }, 14: { cellWidth: 12, halign: 'center' }, 15: { cellWidth: 11, halign: 'center' }, 16: { cellWidth: 9, halign: 'center' }, 17: { cellWidth: 9, halign: 'center' }, 18: { cellWidth: 9, halign: 'center' }, 19: { cellWidth: 9, halign: 'center' } }
      });
      // Resumen y firma
      let y = doc.lastAutoTable.finalY + 8;
      if (y > 170) { doc.addPage(); y = 20; }
      doc.autoTable({ startY: y, margin: { left: 95 }, tableWidth: 107, theme: 'grid',
        head: [[{ content: 'RESUMEN', colSpan: 8, styles: { halign: 'center' } }]],
        body: [['NULOS', r.nulos, 'CONF', r.conf, 'DEMOS', r.demos, 'VENTAS', r.ventas]],
        styles: { fontSize: 8, lineColor: N, lineWidth: 0.2, textColor: N, halign: 'center' }, headStyles: { fillColor: [255, 255, 255], textColor: N, fontStyle: 'normal', fontSize: 9 } });
      y = doc.lastAutoTable.finalY + 10;
      if (q.firma) { try { doc.addImage(q.firma, 'PNG', 222, y - 6, 55, 18); } catch (e) {} }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.text('Fdo.:', 210, y + 13); doc.line(219, y + 13.5, 287, y + 13.5);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(110);
      doc.text(q.firmada ? 'Firmada con el dedo en el Biofy Hub el ' + new Date(q.firmada).toLocaleString('es-ES') + (q.firmadaPor ? ' por ' + q.firmadaPor + ', en nombre del comercial' : '') : 'Sin firmar', 219, y + 17);
      doc.text('Biofy Hub · Quiniela diaria · descargada el ' + new Date().toLocaleString('es-ES'), 10, 203);
      bajaBlob(doc.output('blob'), `Quiniela ${q.comercial} ${q.fecha}.pdf`);
    });
  }

  // Excel de la hoja de producción, con la estructura del original (una hoja por delegación)
  function excelHoja(qs, dias, filaDe, boton) {
    return conEspera(boton, async () => {
      await carga('excel');
      const wb = new window.ExcelJS.Workbook(); wb.creator = 'Biofy Hub';
      const delegs = delegFiltro === 'Todas' ? DELEGACIONES.filter(d => qs.some(q => q.delegacion === d)) : [delegFiltro];
      if (!delegs.length) delegs.push(delegFiltro === 'Todas' ? DELEGACIONES[0] : delegFiltro);
      const DIAS = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES'];
      const nC = 3 + ORIGENES.length * 3 + 1, ult = nC;   // A día, B nº, C nombre, grupos, total
      const col = n => { let t = ''; while (n > 0) { const m = (n - 1) % 26; t = String.fromCharCode(65 + m) + t; n = Math.floor((n - 1) / 26); } return t; };
      const fino = { style: 'thin', color: { argb: 'FF000000' } }, borde = { top: fino, left: fino, bottom: fino, right: fino };
      const gris = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } }, gris2 = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
      for (const dg of delegs) {
        const ws = wb.addWorksheet(dg.toUpperCase(), { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } } });
        ws.columns = [{ width: 12 }, { width: 5 }, { width: 26 }].concat(ORIGENES.flatMap(() => [{ width: 6 }, { width: 6 }, { width: 6 }]), [{ width: 9 }]);
        const deDg = qs.filter(q => q.delegacion === dg);
        const nombres = [...new Set(deDg.map(q => q.comercial))].sort((a, b) => a.localeCompare(b));
        // Título, delegación y semana
        ws.mergeCells(1, 1, 1, ult); Object.assign(ws.getCell(1, 1), { value: 'HOJA DE PRODUCCIÓN COMERCIALES' });
        ws.getCell(1, 1).font = { bold: true, size: 14 }; ws.getCell(1, 1).alignment = { horizontal: 'center' };
        ws.mergeCells(2, 1, 2, 3); ws.getCell(2, 1).value = 'DELEGACIÓN:  ' + dg.toUpperCase(); ws.getCell(2, 1).font = { bold: true };
        ws.mergeCells(2, 4, 2, ult); ws.getCell(2, 4).value = 'SEMANA DEL ' + fechaCorta(dias[0]) + ' AL ' + fechaCorta(dias[4]); ws.getCell(2, 4).font = { bold: true };
        // Cabecera de dos filas: NOMBRE, un grupo por origen (NUL, DEMO, VENT) y TOTAL
        ws.mergeCells(3, 1, 4, 2); ws.mergeCells(3, 3, 4, 3); ws.getCell(3, 3).value = 'NOMBRE';
        ORIGENES.forEach((o, k) => { const c0 = 4 + k * 3; ws.mergeCells(3, c0, 3, c0 + 2); ws.getCell(3, c0).value = o.toUpperCase(); ['NUL', 'DEMO', 'VENT'].forEach((t, j) => ws.getCell(4, c0 + j).value = t); });
        ws.mergeCells(3, ult, 4, ult); ws.getCell(3, ult).value = 'TOTAL';
        for (let rr = 3; rr <= 4; rr++) for (let cc = 1; cc <= ult; cc++) { const ce = ws.getCell(rr, cc); ce.fill = gris; ce.font = { bold: true, size: 9 }; ce.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; ce.border = borde; }
        // Un bloque por día: una fila por comercial y la fila de totales (con fórmulas, como el original)
        let fila = 5; const totales = [];
        dias.forEach((d, k) => {
          const ini = fila, filasDia = Math.max(nombres.length, 1);
          for (let i = 0; i < filasDia; i++, fila++) {
            const n = nombres[i] || '', q = n ? deDg.find(x => x.comercial === n && x.fecha === d) : null, v = q ? filaDe(q) : null;
            ws.getCell(fila, 2).value = n ? (i + 1) + 'º' : ''; ws.getCell(fila, 3).value = n;
            for (let j = 0; j < ORIGENES.length * 3; j++) ws.getCell(fila, 4 + j).value = v && v[j] ? v[j] : null;
            const vent = ORIGENES.map((_, o) => col(6 + o * 3) + fila);
            ws.getCell(fila, ult).value = { formula: `IF(COUNT(${vent.join(',')})=0,"",SUM(${vent.join(',')}))` };
          }
          ws.mergeCells(ini, 1, fila - 1, 1); ws.getCell(ini, 1).value = DIAS[k] + '\n' + fechaCorta(d);
          ws.getCell(ini, 1).alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; ws.getCell(ini, 1).font = { bold: true };
          ws.getCell(fila, 1).value = 'TOTALES';
          for (let cc = 4; cc <= ult; cc++) { const L = col(cc); ws.getCell(fila, cc).value = { formula: `IF(COUNT(${L}${ini}:${L}${fila - 1})=0,"",SUM(${L}${ini}:${L}${fila - 1}))` }; }
          for (let cc = 1; cc <= ult; cc++) { ws.getCell(fila, cc).fill = gris2; ws.getCell(fila, cc).font = { bold: true }; }
          ws.mergeCells(fila, 1, fila, 3);
          totales.push(fila); fila++;
        });
        // Total semanal
        ws.getCell(fila, 1).value = 'TOTAL SEMANAL'; ws.mergeCells(fila, 1, fila, 3);
        for (let cc = 4; cc <= ult; cc++) { const L = col(cc), refs = totales.map(t => L + t).join(','); ws.getCell(fila, cc).value = { formula: `IF(COUNT(${refs})=0,"",SUM(${refs}))` }; }
        for (let cc = 1; cc <= ult; cc++) { ws.getCell(fila, cc).fill = gris; ws.getCell(fila, cc).font = { bold: true }; }
        for (let rr = 5; rr <= fila; rr++) for (let cc = 1; cc <= ult; cc++) { const ce = ws.getCell(rr, cc); ce.border = borde; if (cc > 3) ce.alignment = { horizontal: 'center', vertical: 'middle' }; }
        ws.views = [{ state: 'frozen', ySplit: 4 }];
      }
      const buf = await wb.xlsx.writeBuffer();
      bajaBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Hoja de produccion ${delegFiltro === 'Todas' ? 'todas' : delegFiltro} semana ${dias[0]}.xlsx`);
    });
  }

  pinta();
});
</script>
